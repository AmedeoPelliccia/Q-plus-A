# Programme-agnostic index of TRL and upgradeability registers for each
# Q+ATLANTIDE master range (architecture band).
#
# Q+ATLANTIDE  = architecture-taxonomy ecosystem (programme-agnostic).
# Q+ATLANTIDE1000 = controlled 000-999 identification schema.
#
# Architecture-level TRL values remain programme-agnostic. Programme-specific
# TRL values must be recorded separately with programme/product/configuration/
# lifecycle/evidence effectivity (QATL-TRL-PROGRAMME-001).

