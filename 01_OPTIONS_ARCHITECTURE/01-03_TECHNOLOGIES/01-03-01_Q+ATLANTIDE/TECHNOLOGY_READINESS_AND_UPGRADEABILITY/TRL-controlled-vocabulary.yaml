# TRL Controlled Vocabulary
#
# Controlled vocabulary for Technology Readiness Levels used across Q+ATLANTIDE.
# Q+ATLANTIDE is the programme-agnostic architecture-taxonomy ecosystem.
# Q+ATLANTIDE1000 is the controlled 000-999 identification schema.
#
# TRL = technology maturity (NOT product/CAD/configuration maturity).

trl_controlled_vocabulary:
  scheme: "Q+ATLANTIDE-TRL"
  meaning: "Technology Readiness Level — technology maturity claim"
  status: "controlled"
  levels:
    - id: "TRL-1"
      definition: "Basic principles observed and reported."
    - id: "TRL-2"
      definition: "Technology concept and/or application formulated."
    - id: "TRL-3"
      definition: "Analytical and experimental proof of concept."
    - id: "TRL-4"
      definition: "Component and/or breadboard validation in laboratory environment."
    - id: "TRL-5"
      definition: "Component and/or breadboard validation in relevant environment."
    - id: "TRL-6"
      definition: "System/subsystem model or prototype demonstration in relevant environment."
    - id: "TRL-7"
      definition: "System prototype demonstration in operational environment."
    - id: "TRL-8"
      definition: "Actual system completed and qualified through test and demonstration."
    - id: "TRL-9"
      definition: "Actual system proven through successful mission operations."

trl_lifecycle_relationship:
  id: QATL-TRL-LC-001
  rule: >
    TRL measures technology maturity. LC-letter stages measure product, CAD,
    integration, and configuration maturity. A technology reaching a target TRL
    does not automatically authorize installation into a product baseline. It
    authorizes the start of a controlled product-specific upgrade revision cycle.

programme_trl_rule:
  id: QATL-TRL-PROGRAMME-001
  rule: >
    Architecture-level TRL values shall remain programme-agnostic.
    Programme-specific TRL values shall be recorded separately with programme,
    product, configuration, lifecycle state, and evidence effectivity.
