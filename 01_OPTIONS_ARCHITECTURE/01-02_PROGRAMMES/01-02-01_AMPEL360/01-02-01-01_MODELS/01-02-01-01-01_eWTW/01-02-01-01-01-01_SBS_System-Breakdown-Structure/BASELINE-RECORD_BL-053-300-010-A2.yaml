    - {view: TPMS,  criterion: "first performance estimates recorded",               met: true,  evidence: "TPM-533001-MASS 80.3 kg on the geometry of record"}
    - {view: RBS,   criterion: "risk register opened for the scope",                 met: true,  evidence: "R-533001-01..05"}
    - {view: EBS,   criterion: "concept evidence indexed",                           met: true,  evidence: "verification report indexed; LC-001 records to be added"}
