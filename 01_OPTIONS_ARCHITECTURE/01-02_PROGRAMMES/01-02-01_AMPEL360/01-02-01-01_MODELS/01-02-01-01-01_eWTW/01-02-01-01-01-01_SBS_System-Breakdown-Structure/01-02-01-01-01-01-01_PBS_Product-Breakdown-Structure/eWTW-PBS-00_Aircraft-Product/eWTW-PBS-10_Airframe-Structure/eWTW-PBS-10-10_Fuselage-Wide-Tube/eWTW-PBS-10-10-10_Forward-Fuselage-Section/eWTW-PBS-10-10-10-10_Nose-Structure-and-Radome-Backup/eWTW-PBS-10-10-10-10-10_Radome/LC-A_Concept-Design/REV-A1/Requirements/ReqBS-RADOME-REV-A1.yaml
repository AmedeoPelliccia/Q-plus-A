  - id: F2
    class: F-DEFER
    description: Solid body only; sandwich wall detail deferred.
    reqbs_impact: REQ-A1-1403 (wall construction detail deferred to LC-C)
    gate: becomes mandatory at LC-C

  - id: F3
    class: F-BLOCK
    description: Controlled CAD metadata must be completed.
    reqbs_impact: Physical-characteristics traceability (ReqBS-14)
    gate: blocks RADOME-REV-A_RELEASED

  - id: F4
    class: F-WARN
    description: IBS/CBS/RBS/EBS/TPMS revision packages pending.
    reqbs_impact: Full configuration release blocked if not completed.
    gate: blocks full configuration release

