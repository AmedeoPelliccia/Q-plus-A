    unit: dB
    target: "≤ 0.8"
    threshold: 1.0
    margin: TBD
    status: concept
    linked_reqs:
      - REQ-A1-1101
      - REQ-A1-0501

  - id: TPM-A1-02
    measure: Boresight error
    unit: degrees
    target: TBD
    threshold: TBD
    margin: TBD
    status: concept
    linked_reqs:
      - REQ-A1-1102
      - REQ-A1-0501

  - id: TPM-A1-03
    measure: Mass
    unit: kg
    target: TBD
    threshold: TBD
    margin: TBD
