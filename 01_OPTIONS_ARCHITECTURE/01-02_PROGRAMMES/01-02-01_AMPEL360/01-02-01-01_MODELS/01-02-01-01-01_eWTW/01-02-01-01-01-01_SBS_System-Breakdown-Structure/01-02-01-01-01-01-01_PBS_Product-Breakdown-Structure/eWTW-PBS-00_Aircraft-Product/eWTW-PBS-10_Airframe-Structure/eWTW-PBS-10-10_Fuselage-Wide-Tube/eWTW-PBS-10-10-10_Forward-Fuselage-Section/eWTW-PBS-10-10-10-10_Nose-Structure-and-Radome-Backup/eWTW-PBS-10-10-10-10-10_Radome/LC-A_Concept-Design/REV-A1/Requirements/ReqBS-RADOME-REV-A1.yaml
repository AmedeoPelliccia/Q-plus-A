# ============================================================================
# REQUIREMENTS BY CLASS
# ============================================================================

requirements:

  # --------------------------------------------------------------------------
  # ReqBS-01  Customer Expectations
  # --------------------------------------------------------------------------
  reqbs_01_customer_expectations:
    - id: REQ-A1-0101
      title: Weather-detection capability
      description: >
        The aircraft shall have forward-looking weather-detection capability
        requiring an RF-transparent nose fairing.
      source: programme-level
      rev_a0_predecessor: null
      verification: analysis
      status: active

  # --------------------------------------------------------------------------
  # ReqBS-02  Project and Enterprise Constraints
  # --------------------------------------------------------------------------
  reqbs_02_project_enterprise_constraints:
    - id: REQ-A1-0201
      title: Programme governance
      description: >
        The radome shall be developed within the AMPEL360 eWTW programme,
        electric-architecture configuration, under GQAOA governance.
      source: programme
      rev_a0_predecessor: null
      verification: inspection
      status: active

    - id: REQ-A1-0202
      title: DMC identity compliance
      description: >
        The radome design shall be compatible with the Q-plus lifecycle model
        (LC-letter) and the DMC identity convention (AMPEL360-DMC-ID-001).
      source: AMPEL360-CSDB-DMC-IDENTITY-CONVENTION
      rev_a0_predecessor: null
      verification: inspection
      status: active

  # --------------------------------------------------------------------------
  # ReqBS-03  External Constraints
  # --------------------------------------------------------------------------
  reqbs_03_external_constraints:
    - id: REQ-A1-0301
      title: Bird-strike resistance
      description: >
        The radome shall meet bird-strike resistance requirements of CS 25.631
        (or equivalent) for the applicable aircraft category and speed.
      source: CS-25
      rev_a0_predecessor: REQ-A0-005
      verification: test
      status: active

    - id: REQ-A1-0302
      title: Lightning attachment zone 1A
      description: >
        The radome shall sustain lightning attachment in zone 1A per CS 25.581
        without compromise to structural integrity or RF performance.
      source: CS-25
      rev_a0_predecessor: REQ-A0-005
      verification: test
      status: active

    - id: REQ-A1-0303
      title: RF performance standard
      description: >
        Radome RF performance shall be assessed against RTCA DO-213 or an
        equivalent programme-accepted standard.
      source: RTCA DO-213
      rev_a0_predecessor: null
      verification: test
      status: active

  # --------------------------------------------------------------------------
  # ReqBS-04  Operational Scenarios
  # --------------------------------------------------------------------------
  reqbs_04_operational_scenarios:
    - id: REQ-A1-0401
      title: Normal operation
      description: >
        The radome transmits and receives radar signals with acceptable loss
        during all phases of flight.
      source: SSOT
      rev_a0_predecessor: null
      verification: test
      status: active

    - id: REQ-A1-0402
      title: Degraded operation
      description: >
        Moisture ingress or surface damage degrades RF performance; the crew
        is alerted and maintenance is scheduled.
      source: SSOT
      rev_a0_predecessor: null
      verification: analysis
      status: active

    - id: REQ-A1-0403
      title: Maintenance operation
      description: >
        The radome is removed, inspected, repaired (patch or full replacement),
        and reinstalled for radar access.
      source: SSOT
      rev_a0_predecessor: REQ-A0-006
      verification: demonstration
      status: active

  # --------------------------------------------------------------------------
  # ReqBS-05  Measures of Effectiveness
  # --------------------------------------------------------------------------
  reqbs_05_measures_of_effectiveness:
    - id: REQ-A1-0501
      title: Primary effectiveness measures
      description: >
        RF transmission efficiency, boresight error, and structural margin
        after bird strike shall be the primary effectiveness measures.
      source: SSOT / TRL assessment
      rev_a0_predecessor: null
      verification: analysis
      status: active
      tpm_links:
        - TPM-A1-01
        - TPM-A1-02
        - TPM-A1-04

  # --------------------------------------------------------------------------
  # ReqBS-06  System Boundaries
  # --------------------------------------------------------------------------
  reqbs_06_system_boundaries:
    - id: REQ-A1-0601
      title: Radome physical boundary
      description: >
        The radome boundary extends from the nose tip to the attachment
        interface with the radome backup bulkhead. The radome is unpressurized
        (forward of the forward pressure bulkhead).
      source: SSOT
      rev_a0_predecessor: REQ-A0-003
      verification: inspection
      status: active

    - id: REQ-A1-0602
      title: Provisions-vs-systems boundary
      description: >
        The radome owns structure and installation provisions only. The
        weather-radar antenna and the lightning diverter strips are external
        systems, referenced not contained.
      source: SSOT
      rev_a0_predecessor: null
      verification: inspection
      status: active
      note: >
        This is the provisions-vs-systems rule applied to requirements.
        The radome meets RF and lightning performance values set by external
        systems (WXR, LPS); it does not define them.

  # --------------------------------------------------------------------------
  # ReqBS-07  Interfaces
  # --------------------------------------------------------------------------
  reqbs_07_interfaces:
    - id: REQ-A1-0701
      title: Mechanical attach to backup bulkhead
      description: >
        Hinge/latch mechanical attachment to the radome backup bulkhead;
        removable for radar access.
      source: SSOT interfaces
      rev_a0_predecessor: REQ-A0-003
      verification: test
      status: active
      ibs_link: IBS-RADOME-REV-A1

    - id: REQ-A1-0702
      title: RF-window interface to WXR
      description: >
        The radome shall meet the RF-transparency requirement imposed by the
        weather-radar system. The value is set by WXR (provisions vs systems).
      source: SSOT interfaces
      rev_a0_predecessor: REQ-A0-002
      verification: test
      status: active
      ibs_link: IBS-RADOME-REV-A1
      note: Value owner is WXR system branch, not radome.

    - id: REQ-A1-0703
      title: LPS bonding and diverter-strip mounting
      description: >
        Bonding and diverter-strip mounting provisions on the radome outer
        surface for the lightning-protection system. The embedded conductive
        mesh is radome-owned; surface diverter strips remain LPS-owned.
      source: SSOT interfaces
      rev_a0_predecessor: REQ-A0-005
      verification: test
      status: active
      ibs_link: IBS-RADOME-REV-A1

    - id: REQ-A1-0704
      title: Moisture seal and drainage
      description: >
        Moisture-seal and drainage interface at the radome / backup-bulkhead
        joint.
      source: SSOT BOM
      rev_a0_predecessor: null
      verification: test
      status: active

  # --------------------------------------------------------------------------
  # ReqBS-08  Utilization Environments
  # --------------------------------------------------------------------------
  reqbs_08_utilization_environments:
    - id: REQ-A1-0801
      title: Flight-envelope environments
      description: >
        The radome shall operate across the full eWTW flight envelope
        (altitude, speed, temperature, pressure per CS 25.1309 environmental
        conditions).
      source: programme
      rev_a0_predecessor: null
      verification: analysis
      status: active

    - id: REQ-A1-0802
      title: Surface erosion environments
      description: >
        The radome leading surface shall resist rain erosion, hail impact,
        sand, and UV/ozone exposure.
      source: SSOT
      rev_a0_predecessor: null
      verification: test
      status: active

    - id: REQ-A1-0803
      title: Lightning zone exposure
      description: >
        Lightning exposure zone 1A (initial attachment, high current).
      source: SSOT
      rev_a0_predecessor: REQ-A0-005
      verification: test
      status: active

  # --------------------------------------------------------------------------
  # ReqBS-09  Lifecycle Requirements
  # --------------------------------------------------------------------------
  reqbs_09_lifecycle_requirements:
    - id: REQ-A1-0901
      title: Removability for radar access
      description: >
        The radome shall be removable by ground crew for weather-radar access,
        inspection, and maintenance.
      source: SSOT
      rev_a0_predecessor: REQ-A0-006
      verification: demonstration
      status: active

    - id: REQ-A1-0902
      title: In-service repairability
      description: >
        The radome shall be repairable in-service (local patch repair for
        minor damage).
      source: SSOT
      rev_a0_predecessor: null
      verification: demonstration
      status: active

    - id: REQ-A1-0903
      title: End-of-life circularity
      description: >
        The radome shall be designed for end-of-life recovery per LC-N
        (materials recyclability and circularity).
      source: lifecycle model
      rev_a0_predecessor: null
      verification: analysis
      status: active

  # --------------------------------------------------------------------------
  # ReqBS-10  Functional Requirements
  # --------------------------------------------------------------------------
  reqbs_10_functional_requirements:
    - id: REQ-A1-1001
      title: Aerodynamic forward fairing
      description: >
        Provide an aerodynamic forward fairing for the aircraft nose.
      source: SSOT
      rev_a0_predecessor: REQ-A0-001
      verification: analysis
      status: active

    - id: REQ-A1-1002
      title: RF-transparent window
      description: >
        Provide an RF-transparent window through which the weather radar
        transmits and receives.
      source: SSOT
      rev_a0_predecessor: REQ-A0-002
      verification: test
      status: active

    - id: REQ-A1-1003
      title: Bird-strike containment
      description: >
        Sustain bird strike without debris penetrating to the radar antenna
        or the backup bulkhead.
      source: SSOT
      rev_a0_predecessor: null
      verification: test
      status: active

    - id: REQ-A1-1004
      title: Lightning-attachment support
      description: >
        Support lightning attachment via bonding provisions and diverter-strip
        mounting. The embedded conductive mesh is integral to the radome
        laminate; surface diverter strips are LPS-owned provisions.
      source: SSOT
      rev_a0_predecessor: REQ-A0-005
      verification: test
      status: active

  # --------------------------------------------------------------------------
  # ReqBS-11  Performance Requirements
  # --------------------------------------------------------------------------
  reqbs_11_performance_requirements:
    - id: REQ-A1-1101
      title: RF transmission loss
      description: >
        RF transmission loss through the radome wall shall not exceed the
        value defined by the weather-radar system.
      source: WXR interface (value set by radar system)
      rev_a0_predecessor: REQ-A0-002
      verification: test
      status: active
      value: "≤ 0.8"
      unit: dB
      tpm_link: TPM-A1-01
      note: >
        Provisions-vs-systems: Value resolved by upstream ARS-A1-0101-D01.
        The radome shall meet ≤ 0.8 dB one-way transmission loss at 9.3–9.5 GHz
        across ±60° azimuth / ±15° elevation. Source: ARS-A1-0101-D01.

    - id: REQ-A1-1102
      title: Boresight error
      description: >
        Boresight error introduced by the radome shall not exceed TBD degrees.
      source: WXR interface
      rev_a0_predecessor: null
      verification: test
      status: active
      value: TBD
      unit: degrees
      tpm_link: TPM-A1-02

    - id: REQ-A1-1103
      title: Bird-strike impact resistance
      description: >
        The radome shall sustain a bird-strike impact energy of TBD J at the
        design speed per CS 25.631.
      source: CS-25
      rev_a0_predecessor: null
      verification: test
      status: active
      value: TBD
      unit: J
      tpm_link: TPM-A1-04

  # --------------------------------------------------------------------------
  # ReqBS-12  Modes of Operation
  # --------------------------------------------------------------------------
  reqbs_12_modes_of_operation:
    - id: REQ-A1-1201
      title: Normal mode
      description: >
        Radome installed, intact, RF performance nominal.
      source: SSOT
      rev_a0_predecessor: null
      verification: analysis
      status: active

    - id: REQ-A1-1202
      title: Degraded mode
      description: >
        Moisture ingress or minor damage; RF performance reduced but radar
        functional with crew alert.
      source: SSOT
      rev_a0_predecessor: null
      verification: analysis
      status: active

    - id: REQ-A1-1203
      title: Maintenance mode
      description: >
        Radome removed; radar access open.
      source: SSOT
      rev_a0_predecessor: REQ-A0-006
      verification: demonstration
      status: active

  # --------------------------------------------------------------------------
  # ReqBS-14  Physical Characteristics
  # --------------------------------------------------------------------------
  reqbs_14_physical_characteristics:
    - id: REQ-A1-1401
      title: External form
      description: >
        The radome external form is a secant ogive with fineness ratio
        approximately 1.36.
      source: CAD record REV-A0/A1
      rev_a0_predecessor: REQ-A0-004
      verification: inspection
      status: active

    - id: REQ-A1-1402
      title: Absolute dimensions
      description: >
        Absolute dimensions are TBD pending CAD scale resolution.
      source: CAD finding F1
      rev_a0_predecessor: REQ-A0-004
      verification: inspection
      status: active
      blocked_by: F1

    - id: REQ-A1-1403
      title: Wall construction
      description: >
        The radome wall shall be an RF-transparent sandwich laminate. Detail
        (ply count, core, material IDs) deferred to LC-C.
      source: SSOT
      rev_a0_predecessor: null
      verification: test
      status: active
      deferred_detail_to: LC-C
      blocked_by: F2

  # --------------------------------------------------------------------------
  # ReqBS-15  Human Systems Integration
  # --------------------------------------------------------------------------
  reqbs_15_human_systems_integration:
    - id: REQ-A1-1501
      title: Two-person removal/installation
      description: >
        Removal and installation by two ground-crew members without specialist
        tooling.
      source: SSOT lifecycle
      rev_a0_predecessor: REQ-A0-006
      verification: demonstration
      status: active

    - id: REQ-A1-1502
      title: Visual inspection access
      description: >
        Visual inspection of internal and external surfaces without
        disassembly of the radar antenna.
      source: maintenance concept
      rev_a0_predecessor: null
      verification: demonstration
      status: active

    - id: REQ-A1-1503
      title: Non-hazardous maintenance materials
      description: >
        Radome materials shall not require hazardous-material handling during
        normal maintenance.
      source: DEGF-INHERIT-001 (Kindness)
      rev_a0_predecessor: null
      verification: inspection
      status: active
      degf_trait: Kindness

