# the EBS references it, never relocates it).
# Per AMPEL360-SBS-ID-CM-002 SS3 the EBS has no id space of its own: rows are
# path-addressed and carry subject: (a part number or an act id).
# Row schema: class, subject, path (relative to the SBS root; null when the act
# text is not on disk), status, note (optional), citedBy (optional), action (required
# when status is pending-commit).
# Status: on-disk | cited-only (an act cited by id, text not on disk) | pending-commit
# (an artefact produced but not yet committed; the row carries the action that resolves
# it and becomes on-disk when the artefact is committed into its node).

