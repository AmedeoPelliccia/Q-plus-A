    nearest: '024-230'
    note: named as an alternate source by AMC 25.1351(d) and fitted to the Embraer 190 (TSB Canada A16O0066); S-ATLAS has no node for it
  conditions: Sources able to supply essential loads after loss of the normal electrical sources; independence from the normal sources is assessed for each architecture
  source: Research records of 2026-11-13 and 2026-11-14 for KNOT-EWTW-ESS-001, in the KNOT register; AMC 25.1351(d) names batteries, auxiliary power units and ram-air turbines as alternate sources
  source_checked: null
  authority: taxonomy owner
  state: PROPOSED
