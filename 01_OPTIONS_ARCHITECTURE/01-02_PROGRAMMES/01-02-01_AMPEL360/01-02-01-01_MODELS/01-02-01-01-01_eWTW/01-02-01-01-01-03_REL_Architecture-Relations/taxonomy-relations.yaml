# Taxonomy relations — QPLUS-REL-001 (proposed). Pilot set, held in the eWTW model until the taxonomy owner adopts it.
level: taxonomy
namespace: S-ATLAS
alternatives:
- key: electric-propulsion-power-source
  for: electric power for propulsion
  members: ['068', '074', '075']
  conditions: Sources of electric power for an electrified propulsion chain; an architecture uses one source or an admitted combination
  source: NASA/TM-20210026284 §1.0 (all-electric, hybrid electric and turboelectric architectures); NASA/CR-20260001562 (fuel-cell electric propulsion)
  source_checked: '2026-11-12'
  authority: taxonomy owner
  state: PROPOSED
