# KNOT record — AMPEL360-KNOT-CM-004 Issue 1 (proposed)
knot:
  knot_id: KNOT-EWTW-CRZ-001
  title: Cruise point
  kind: decision-anchor
  taxonomy: ['021', '024', '071', '076', '077']
  raised_at: null
  question: 'Cruise point of the eWTW: which Mach number and which altitude?'
  context: >-
    The missions of the eWTW fix distances, seats and reserves, and no cruise speed or altitude. Three pieces of work wait for them. A propeller and a ducted fan cannot be compared before the cruise Mach is set. The voltage of the propulsion network depends on the altitude, because the margin against partial discharge falls with pressure. The power of the cabin air compressors depends on the cruise altitude and on the cabin altitude. The research has to say what cruise points aircraft of 70 to 100 seats fly, with propellers and with fans, and what each point costs in block time, in propulsive efficiency, in cabin compression and in electrical insulation.
  effectivity:
  - model: eWTW
    variants: []
    from_baseline: null
  obligation_source: 02_LIFECYCLE_MODEL §3 — major configuration decisions are LC-B deliverables; research records of 2026-11-14 on the propulsion chain and on the electrical sources
  lifecycle_phase: LC-A
