    title: Cruise points of the class
    knu_class: ANALYSIS_PACKAGE
    description: 'Cruise Mach and altitude of aircraft of 70 to 100 seats, and what each point costs'
    research_brief:
      questions:
      - 'What cruise Mach numbers and altitudes do in-service aircraft of 70 to 100 seats fly, with propellers and with turbofans, and what block times follow on stages of 500, 1,100 and 2,000 km?'
      - 'How does the efficiency of a propeller and of a ducted fan vary with the cruise Mach number between 0.5 and 0.8, in measurements and not only in project calculations?'
      - 'What cabin altitude and pressure differential do types of this class certify, and how does the power of an electric cabin air compressor vary with the cruise altitude?'
      - 'How does the partial-discharge inception voltage of aircraft insulation vary with altitude between 20,000 and 40,000 ft, in published tests?'
