  rulings:
  - id: R1
    date: '2026-11-16'
    authority: AM.PEL — architecture authority
    statement: 'Two decisions. One: the maturity that the decision of the cruise point requires is approved — level 6 of the Q+ATLANTIDE-TRL scale at the release of the preliminary-design baseline, for the turbogenerator of megawatt class, for the propeller driven by an electric motor of megawatt class and for the ducted fan driven by one. It is the threshold of ruling R2 of KNOT-EWTW-NRG-001, and no waiver is sought. Two: the minimum objective on carbon dioxide, criterion M5, is to be met at the release of the preliminary-design baseline; at the concept baseline the gap at nominal values is recorded as a target. The options stay open, and the criteria stay proposed'
    effect: maturity records Q1 to Q3 approved; moment of application of criterion M5 fixed; no option scored or excluded
    rationale: 'One element has one threshold in every decision that depends on it: the turbogenerator is record Q4 of KNOT-EWTW-NRG-001 and record Q1 here, and a waiver is not needed and would weaken that coherence. The authority approved the records unless the reviewer saw problems; the reviewer found none against the thresholds, and recorded that no element has a level on the evidence on record. Applied today to nominal values, criterion M5 would reject every option: the screening puts the metric 23 % above the objective at the propeller points and 39 % above it at the jet point. The authority keeps the options open, so the objective is a target of the design until the preliminary-design baseline, as the maturity threshold is'
    rationale_recorded: '2026-11-16'
