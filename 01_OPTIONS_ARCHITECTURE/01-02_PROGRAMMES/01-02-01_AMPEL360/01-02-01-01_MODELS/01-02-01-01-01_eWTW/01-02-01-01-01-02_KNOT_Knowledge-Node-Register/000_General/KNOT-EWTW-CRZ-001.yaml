    class: mandatory
    text: 'The cabin pressure altitude is not above 8,000 ft at the maximum operating altitude, in normal operation'
    source: 'EASA CS 25.841(a), amendment 25/15, read on 2026-11-15'
    weight: null
    threshold: null
    state: PROPOSED
  - id: M2
    class: mandatory
    text: 'Above 25,000 ft, the cabin pressure altitude stays at or below 15,000 ft after any reasonably probable failure of the pressurisation system. It applies to the points above 25,000 ft only'
    source: 'EASA CS 25.841(a), amendment 25/15, read on 2026-11-15'
    weight: null
    threshold: null
    state: PROPOSED
  - id: M3
    class: mandatory
    text: 'The requirement mission closes at the cruise point, with the reserves of ruling R2 of KNOT-EWTW-NRG-001'
    source: 'Ruling R2 of KNOT-EWTW-NRG-001, 2026-11-14'
    weight: null
    threshold: null
    state: PROPOSED
  - id: M4
    class: mandatory
    text: 'The cruise speed is not below 360 kt true airspeed, that of the fastest turboprop of the class in service. It is the floor of service of rule 19 of CM-004'
    source: 'Proposed on 2026-11-15 as a floor of the class, on the specification sheet of the Dash 8-400, and kept by the authority on 2026-11-16. It is a requirement of the programme and is in no text; the research of 2026-11-16 found no evidence for or against a floor at this speed, and the authority then kept it, stated in knots'
    weight: null
    threshold: null
    state: PROPOSED
  - id: M5
    class: mandatory
    text: 'The carbon dioxide metric of the aircraft, as ICAO Annex 16 Volume III defines it, is at least 26 % below the new-type level at its take-off mass, and the aircraft is to better that margin where it can. It is the goal of the independent experts of ICAO for a regional jet of 2037. The most stringent limit in law, on 2026-11-16 the 11 % below the new-type level of the EU taxonomy for 5.7 to 60 t, stays as the floor under it. The objective is to be met at the release of the preliminary-design baseline; at the concept baseline the gap at nominal values is recorded as a target'
    source: 'Decision of the authority of 2026-11-18: the objective is 26 % and beyond. It replaces as objective the legal minimum of the decision of 2026-11-16, which stays as the floor. Record of the objective and the premises, 2026-11-18; research record of the technology goals, 2026-11-18, statement 2; research record of the environmental measure, 2026-11-16, statements 1 to 3. The moment of application was proposed by the reviewer and fixed by ruling R1 of 2026-11-16, when the criterion stood at 11 %'
    weight: null
    threshold: null
    state: PROPOSED
  - id: T1
    class: tradable
    text: 'Power of the gas turbines for the cruise, referred to sea level, on the take-off mass of the requirement mission. Lower is better'
    source: 'Screening of the cruise points CRP-EWTW-CRZ-001; order proposed on 2026-11-16'
    weight: null
    threshold: 0.05
    precedence: 2
    state: PROPOSED
  - id: T2
    class: tradable
    text: 'Fuel loaded on the scoring mission, the one measure of environmental effect on record: the emissions in flight follow the fuel burned. Lower is better'
    source: 'Screening of the cruise points CRP-EWTW-CRZ-001; north star by decision of the authority of 2026-11-16, rule 19 of CM-004'
    weight: null
    threshold: 0.05
    precedence: 1
    north_star: true
    state: PROPOSED
  - id: T3
    class: tradable
    text: 'Time at cruise speed on the scoring mission. Lower is better'
    source: 'Screening of the cruise points CRP-EWTW-CRZ-001; order proposed on 2026-11-16'
    weight: null
    threshold: 0.05
    precedence: 3
    state: PROPOSED
  - id: T4
    class: tradable
    text: 'Inception voltage of partial discharge left at the cruise altitude, as a share of its value at sea level. Higher is better'
    source: 'Screening of the cruise points CRP-EWTW-CRZ-001; order proposed on 2026-11-16'
    weight: null
    threshold: 0.05
    precedence: 4
    state: PROPOSED
  - id: T5
    class: tradable
    text: 'Ideal work to compress outside air to the cabin pressure. Lower is better'
    source: 'Screening of the cruise points CRP-EWTW-CRZ-001; order proposed on 2026-11-16'
