# KNOT record — AMPEL360-KNOT-CM-004 Issue 1 (proposed)
knot:
  knot_id: KNOT-EWTW-CAD-001
  title: 3D model of record
  kind: control-intent
  taxonomy: []
  raised_at: null
  question: '3D model of record: is its source a generator script or a FreeCAD document, and how are station models assembled and identified?'
  context: >-
    The geometry of record of EWTW-533001-000 is not drawn by hand. A Python script built on CadQuery generates it and writes a STEP file for exchange, a glTF file for preview and a verification report. Body names are part numbers, except for four butt straps that have no controlled part number yet. Set nodes are sub-assemblies, and a run record keeps the provenance. Views of the model opened in FreeCAD are kept with the part as media. Up to version 0.2.1 the script wrote two bodies of the valve surround malformed and the STEP file as AP214. Opened in FreeCAD 1.0.0, that file showed 119 bodies where the report counted 50, and FreeCAD's rule of unique labels gave some of them labels that are not part numbers. Version 0.2.2, on main since 2026-11-13, writes one valid solid for each leaf body and AP242, and its output shows 50 bodies under their part numbers in FreeCAD. That output is not committed yet: the STEP file on main is empty, and the report, the run record and the preview are those of version 0.2.1. The layout of these artefacts and the acceptance checks are written inside the request for that one model. The next models are to be built in FreeCAD, and no FreeCAD document is kept so far. FreeCAD and CadQuery use the same geometry kernel, Open CASCADE, so solids pass between them through STEP, but parameters and the feature history do not. A FreeCAD document is a compressed archive and shows no line differences under version control. The repository validator protects STEP, glTF and image files and does not list the FreeCAD format. The lifecycle registry, still in draft, recommends revision folders by lifecycle layer under cad/freecad, each holding the native deliverable and a record (rule CAD-REVDIR-001). The artefacts of EWTW-533001-000 follow another layout — CAD/source, CAD/exchange, CAD/Preview. No rule says where the model of an assembly of several stations is kept, or which identifier it carries.
