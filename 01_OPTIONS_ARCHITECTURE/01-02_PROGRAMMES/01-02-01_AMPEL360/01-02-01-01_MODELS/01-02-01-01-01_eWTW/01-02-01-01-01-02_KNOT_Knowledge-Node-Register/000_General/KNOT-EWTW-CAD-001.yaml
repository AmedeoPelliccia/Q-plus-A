  knus:
  - knu_id: KNU-EWTW-CAD-001-01
    title: Source of record, script or FreeCAD document
    knu_class: ANALYSIS_PACKAGE
    description: What each option keeps and loses for traceable part numbers, repeatable generation, review under version control and assembly of separately versioned models
    research_brief:
      questions:
      - In FreeCAD 1.x, what does the built-in Assembly workbench offer for placing parts — joints, fixed placements, links to external documents — and how stable are its references when a part is regenerated?
      - Can FreeCAD run without its interface to build a document from a Python script and export STEP AP242 with body names and the assembly tree preserved? What is lost against an export from CadQuery?
      - How do open-hardware and engineering projects keep FreeCAD documents under version control, given that the document is a compressed archive? What do they commit — the document, a script, or both?
      - What does a round trip from STEP into FreeCAD and back to STEP change — names, colours, tree, units, tolerances?
      - How do such projects identify and store an assembly of several separately versioned models?
    serves: []
    outputs:
    - view: EBS
