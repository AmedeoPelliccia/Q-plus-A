# Candidate missions and first-order closure — input record. tools/mission_closure.py reads it and writes the
# screening into README.md. A figure has a basis: assumption, source or decision. A figure with a source or a decision names it in ref.
# A parameter has three values: favourable, nominal and unfavourable to closing the mission.
analysis:
  id: MSN-EWTW-NRG-001
  version: 0.3.0
  date: '2026-11-14'
  knot: KNOT-EWTW-NRG-001
  serves: KNU-EWTW-NRG-001-02
  prepared_by: Claude, for review by STK_SE
  scope: >-
    Three missions for an aircraft of 100 passengers, each with its role, and a first-order test of which energy
    carrier flies each of them in an airframe of the class. The test is a range equation, fitted to the published
    block fuel of one in-service type of the class. It ranks nothing and sizes nothing: it shows the order of
    magnitude and which figures decide.
  assumptions:
  - id: A1
    text: The aircraft carries 100 passengers, fixed by the authority (KNOT-EWTW-NRG-001, ruling R2 of 2026-11-14). The mass taken for each, with baggage, is an assumption until the standard masses of the air operations rules are read
  - id: A2
    text: The airframe is that of the reference type. Its empty mass is the basic operating weight of the reference, and a mission closes when the take-off mass stays within the highest take-off mass certificated for it
  - id: A3
    text: The airframe is not resized for the mission, so its empty mass is fixed. A sensitivity shows what changes when a share of the empty mass grows in proportion to the take-off mass. The three options have the same empty mass. What the electric chain adds and what the turbofans remove is not on record
  - id: A4
    text: Taxi, take-off, climb, descent and approach cost the energy of a fixed distance in cruise. The distance is fitted to the reference, and the eWTW takes a stated share of it
  - id: A5
    text: Reserves are flown as distance in cruise — the contingency as a share of the trip, the alternate as a distance, the final reserve as time at holding speed
  - id: A6
    text: The final reserve of the eWTW is 30 minutes at holding speed, the floor of turbine-engined aeroplanes, adopted as an assumption by the authority (KNOT-EWTW-NRG-001, ruling R2 of 2026-11-14). The rule names no time for electric engines (research record of 2026-11-14, statement 2). The alternate is a separate item
  - id: A7
    text: A battery delivers its specific energy reduced by one share, which covers the capacity held back and the capacity lost at the end of service life
  - id: A8
    text: In option C the battery supplies a stated share of the trip energy, and fuel supplies the rest of the trip and all the reserves
  - id: A9
    text: Fuel burned makes the aircraft lighter, and the test credits it with the logarithmic form of the range equation. A battery keeps its mass
  - id: A10
    text: Take-off shaft power is a fixed power for each kilogram of take-off mass. Units are counted at the ratings that the research record gives for a motor and for a turbogenerator
  - id: A11
    text: The range the reference type is offered with is a check of the test, flown with the reserve of the charts of that type. It is not a requirement of the eWTW until the test reproduces it within a written tolerance (KNOT-EWTW-NRG-001, ruling R2 of 2026-11-14)
  reference:
    aircraft: Embraer 190
    basic_operating_kg: {value: 27753, basis: source, ref: 'Embraer 190 specification sheet, read on 2026-11-14: basic operating weight, standard'}
    sizing_takeoff_kg: {value: 50300, basis: source, ref: 'Embraer 190 specification sheet, read on 2026-11-14: maximum take-off weight, LR'}
    takeoff_limit_kg: {value: 51800, basis: source, ref: 'Embraer 190 specification sheet, read on 2026-11-14: maximum take-off weight, AR'}
    fuel_lb_per_usg: {value: 6.70, basis: source, ref: 'Embraer 190 specification sheet, read on 2026-11-14: fuel density used by the manufacturer'}
    sectors_ref: 'Aircraft Commerce, issue 64, June/July 2009, E-Jet family fuel-burn performance, E-190 with 114 seats and 22,800 lb of payload, long-range cruise, block fuel as trip and 20 minutes of taxi; read on 2026-11-14'
    sectors:
    - {name: SOU-CDG, esad_nm: 207, block_fuel_usg: 633, takeoff_lb: 89366}
    - {name: CDG-SOU, esad_nm: 223, block_fuel_usg: 653, takeoff_lb: 89700}
    - {name: EXT-EGC, esad_nm: 415, block_fuel_usg: 920, takeoff_lb: 91959}
    - {name: EGC-EXT, esad_nm: 437, block_fuel_usg: 971, takeoff_lb: 92114}
    - {name: BHX-TLS, esad_nm: 607, block_fuel_usg: 1196, takeoff_lb: 94274}
    - {name: TLS-BHX, esad_nm: 672, block_fuel_usg: 1313, takeoff_lb: 94778}
    range_check:
      range_nm: 2400
      passengers: 100
      kg_per_passenger: 100
      ref: 'Embraer 190 specification sheet, read on 2026-11-14: range of the LR with full passengers at 100 kg, long-range cruise, typical mission reserves'
      alternate_nm: 100
      flight_min: 45
      reserve_ref: 'Embraer 190 airport planning manual, section 3.2, payload and range charts, revision 20, read on 2026-11-14: reserve of 100 nm alternate and 45 min flight. That the range of the specification sheet uses the same reserve is an assumption, and so is the speed of the 45 minutes'
      tolerance_share: null
  missions:
  - {key: S, name: Short stage, range_km: 500, role: sensitivity, basis: decision, ref: 'KNOT-EWTW-NRG-001, ruling R2 of 2026-11-14', note: 'Where the terminal phases weigh as much as the cruise. It sizes nothing'}
  - {key: M, name: Average stage, range_km: 1100, role: scoring, basis: source, ref: 'Research record of 2026-11-14, statement 4: average stage of the United States fleet of 150 seats and fewer, about 1,110 to 1,140 km'}
  - {key: L, name: Long stage, range_km: 2000, role: requirement, basis: decision, ref: 'KNOT-EWTW-NRG-001, ruling R2 of 2026-11-14', note: 'It must close'}
  - {key: X, name: Range the reference type is offered with, range_km: 4445, role: reference, basis: source, ref: 'Embraer 190 specification sheet, read on 2026-11-14: 2,400 nm for the LR', note: 'A check of the test, not a mission of the eWTW'}
  payload:
    passengers: 100
    kg_per_passenger: {value: 95, basis: assumption}
  reserves:
    contingency_share: {value: 0.05, basis: assumption}
    alternate_km: {value: 185, basis: assumption}
    final_reserve_min: {value: 30, basis: decision, ref: 'KNOT-EWTW-NRG-001, ruling R2 of 2026-11-14: the floor of Regulation (EU) 2021/1296, CAT.OP.MPA.181(c)(5), for turbine-engined aeroplanes, taken as an assumption'}
    holding_speed_kmh: {value: 400, basis: assumption}
  fuel_energy_mj_per_kg: {value: 43.0, basis: assumption, note: 'Lower heating value commonly used for jet fuel; not read at a source'}
  empty_growth_share: {value: 0.0, basis: assumption, note: 'Share of the empty mass that grows with the take-off mass. Zero keeps the airframe of the reference as it is'}
  parameters:
    lift_to_drag: {favourable: 18, nominal: 15, unfavourable: 13, basis: assumption, note: 'Nominal is set so that the cruise of option B costs what the fit gives for the reference'}
    propulsor_efficiency: {favourable: 0.88, nominal: 0.85, unfavourable: 0.80, basis: assumption}
    electric_chain_efficiency: {favourable: 0.93, nominal: 0.90, unfavourable: 0.87, basis: assumption, note: 'From the terminals of the battery or of the generator to the shaft. A manufacturer states above 95 % for motor and electronics at cruise (statement 15)'}
    turbogenerator_efficiency: {favourable: 0.40, nominal: 0.35, unfavourable: 0.30, basis: assumption, note: 'From fuel to electricity'}
    pack_usable_share: {favourable: 0.85, nominal: 0.72, unfavourable: 0.65, basis: assumption, note: 'Nominal is 0.90 usable times 0.80 at the end of service life, as in ELA-EWTW-ESS-001'}
    terminal_share: {favourable: 0.6, nominal: 1.0, unfavourable: 1.2, basis: assumption, note: 'Share of the terminal distance fitted to the reference. Favourable stands for a lower and slower cruise'}
    empty_mass_share: {favourable: 0.80, nominal: 1.00, unfavourable: 1.12, basis: assumption, note: 'Share of the basic operating weight of the reference'}
    takeoff_kw_per_kg: {favourable: 0.16, nominal: 0.20, unfavourable: 0.25, basis: assumption}
  pack_levels:
  - {wh_per_kg: 177, label: 'Pack of a type-certificated two-seat aeroplane, 24.8 kWh', basis: source, ref: 'Pipistrel, Velis Electro product page, read on 2026-11-14: two batteries, 24.8 kWh in total, about 70 kg each'}
  - {wh_per_kg: 480.9, label: 'Laboratory pack, 25 cycles', basis: source, ref: 'Research record of 2026-11-14, statement 11'}
  - {wh_per_kg: 650, label: 'Assumption of a NASA study', basis: source, ref: 'Research record of 2026-11-14, statement 8, as reported'}
  - {wh_per_kg: 1000, label: 'Level one study needs for economic feasibility', basis: source, ref: 'Research record of 2026-11-14, statement 6'}
  hybrid_shares: [0.10, 0.25, 0.50]
  units:
    motor_kw: {value: 750, basis: source, ref: 'Research record of 2026-11-14, statement 15: offered rating of a motor tested in the laboratory'}
    turbogenerator_kw: {value: 1000, basis: source, ref: 'Research record of 2026-11-14, statement 16, as reported: in development'}
