# KNOT record — AMPEL360-KNOT-CM-004 Issue 1 (proposed)
knot:
  knot_id: KNOT-EWTW-AUX-001
  title: Auxiliary power and supply at the stand
  kind: decision-anchor
  taxonomy: ['012', '021', '024', '049', '068']
  raised_at: null
  question: 'What supplies the aircraft at the stand and starts its turbogenerators: the ground alone, a turbogenerator, or an auxiliary power module — and, if a module is carried, of which technology?'
  context: >-
    The model declares the mounts and the firewall of an auxiliary power module in the tailcone, and says that the name does not determine its technology. No record says whether the module is carried. In the register it appears only as option D of KNOT-EWTW-ESS-001, as an essential source. The concept of operations of the environmental control system has an open input on what supplies the packs at the stand, and until this KNOT it was left to the authority. On an aircraft whose packs are electric the stand is a sizing case of its own: the cabin is cooled or heated with the doors open and no ram air, and the turbogenerators are stopped. What supplies the stand may also start the first turbogenerator. The research has to say what power the stand asks, what the ground supplies at airports, how gas turbines of this class are started, and what an auxiliary module of each technology weighs and burns.
  effectivity:
  - model: eWTW
    variants: []
    from_baseline: null
  obligation_source: '02_LIFECYCLE_MODEL §3 — major configuration decisions are LC-B deliverables; eWTW README §3 row 15; open input ground-supply of CONOPS-EWTW-ECS-001'
  lifecycle_phase: LC-A
  due: before REV-B_RELEASED of any scope it affects
  owner: STK_SE
  status: DRAFT
  resolution: OPEN
  created_date: '2026-11-24'
  depends_on:
  - KNOT-EWTW-ESS-001
  - KNOT-EWTW-GEN-001
  - KNOT-EWTW-SRC-001
  closed_with: []
  unblocks: []
  affects:
  - view: model
    ref: README §3 row 15
  - view: PBS
    ref: eWTW-PBS-049-000
    relation: gates
    note: Whether an auxiliary power module is carried, and of which technology
  - view: PBS
    ref: eWTW-PBS-012-000
    relation: gates
    note: External power and conditioned air at the stand
  options:
  - id: A
    text: 'no auxiliary power module carried for the stand: external electrical power at the stand, conditioned air from the ground where the airport gives it, and the first turbogenerator started from the ground supply or from a battery; a module carried for essential power under option D of KNOT-EWTW-ESS-001 also serves the stand'
    state: open
    pbs_footprint: []
  - id: B
    text: 'a turbogenerator in a ground mode supplies the stand, with no separate module'
    state: open
    pbs_footprint:
    - action: update
      taxonomy: '068'
      element: 'turbogenerator installation: a ground mode, at the power of the stand'
      key: turbogenerator-installation
      owner: KNOT-EWTW-SRC-001
  - id: C
    text: 'an auxiliary power module, detached from the propulsion architecture, supplies the stand and starts the turbogenerators; its technology is part of the choice, only when KNOT-EWTW-ESS-001 selects option D and incompatible with its options A, B, C and E'
    state: open
    pbs_footprint:
    - action: update
      taxonomy: '049'
      element: 'auxiliary power module: its technology, its rating for the stand and the start'
      key: auxiliary-power-module
      owner: KNOT-EWTW-ESS-001
  criteria:
  - id: M1
    class: mandatory
    text: 'A module whose function is needed for the dispatch of the aeroplane or for continued safe flight is treated as an essential auxiliary power unit: Category 1, with a demonstrated envelope of altitude and airspeed for starting in flight, cold soak included'
    source: 'EASA CS 25J901(b) and CS 25J903; CS-APU. They speak of an auxiliary power unit: no text read says what stands in their place for a module of another technology'
    weight: null
    threshold: null
    state: PROPOSED
  - id: M2
    class: mandatory
    text: 'A turbogenerator can be restarted in flight within an established envelope of altitude and airspeed; where windmilling does not give the electrical power for ignition, a source independent of the engine-driven generating system gives it'
    source: '14 CFR 25.903(e); the text of CS 25.903(e) is still to be read; its reach to a turbogenerator is not settled'
    weight: null
    threshold: null
    state: PROPOSED
  - id: M3
    class: mandatory
    text: The limits of speed, attitude and altitude of an auxiliary module used as an alternate source are established and shown
    source: 'EASA AMC 25.1351(d), as the record of 2026-11-13 has it in statement 7: as reported, and not read at the source'
    weight: null
    threshold: null
    state: PROPOSED
  - id: M4
    class: mandatory
    text: A lithium battery that starts a turbogenerator or an auxiliary module is installed under the conditions the authority sets for such batteries, and the failure of one cell is contained
    source: 'FAA special conditions 25-359-SC and NTSB/AIR-14/01, as the precedent; not a quotation of a rule'
    weight: null
    threshold: null
    state: PROPOSED
  - id: M5
    class: mandatory
    text: The supply of the stand does not depend on refuelling with a machine running, unless procedures for it are approved by the authority
    source: 'CAT.OP.MPA.200, read in its UK text, which names an engine; the text of the Union is still to be read, and no text read says whether it reaches an auxiliary module or a turbogenerator in a ground mode'
    weight: null
    threshold: null
    state: PROPOSED
  - id: M6
    class: mandatory
    text: The supply of the stand meets the limits on running time and on noise that the airports of the network publish
    source: 'AIP entries, as at Schiphol; ICAO Doc 9889; ICAO Annex 16, Volume I, Attachment C, whose levels are still to be read. They speak of auxiliary power units: no text read says whether they reach a turbogenerator in a ground mode'
    weight: null
    threshold: null
    state: PROPOSED
  - id: M7
    class: mandatory
    text: No person at the stand is exposed to the intake, the exhaust or a rotating part of a running machine, and a running machine is attended from the flight deck
    source: 'derived from the limits of hotel mode as AAIB-28713 gives them; a precedent, not a quotation of a rule'
    weight: null
    threshold: null
    state: PROPOSED
  maturity_required: []
  assumptions:
  - text: 'the model declares tailcone mounts and a firewall for an auxiliary power module (053-400-020 and -030), sizes the ground services against the demand of the packs, and does not determine the technology of the module'
    ref:
      view: model
      ref: README §3 row 15
  - text: 'the concept of operations names three candidates to supply the packs at the stand — external power, the auxiliary power module and a turbogenerator — and carries no figure of power'
    ref:
      view: EBS
      ref: 000_General/evidence/CONOPS-EWTW-ECS-001/README.md
  - text: 'a module chosen as an essential source is assessed with its limits of speed, attitude and altitude, and depends on starting at altitude after a cold soak; a module for the stand alone has no such duty'
    ref:
      view: EBS
      ref: 000_General/evidence/KNOT-EWTW-ESS-001_option-set_2026-11-14.md
  - text: 'a turbogenerator in the propulsion or main generation chain is filed under 068; 049 applies only to an auxiliary unit detached from the propulsion architecture'
    ref:
      view: model
      ref: AMPEL360-KNOT-CM-004 rule 18
  couplings:
  - knot: KNOT-EWTW-ESS-001
    note: option D of that KNOT and option C of this one are one element at 049, which that KNOT owns; a module carried for essential power also serves the stand under option A or C of this KNOT, and essential power is decided first
  - knot: KNOT-EWTW-GEN-001
    note: the number and the rating of the turbogenerators decide whether one of them can supply the stand at an acceptable fuel flow and noise
  - knot: KNOT-EWTW-SRC-001
    note: option B updates the turbogenerator installation owned by this KNOT; the ground-mode choice depends on its source configuration
  - knot: KNOT-EWTW-STO-001
    note: a buffer battery, if one is carried, can start a turbogenerator and hold the stand for a short time
  - knot: KNOT-EWTW-ECS-001
    note: the cooling cycle sets the power the packs draw on the ground with no ram air, which sizes the supply of the stand
  rulings: []
  reopen_if: []
  knus:
  - knu_id: KNU-EWTW-AUX-001-01
    title: Ground supply, start and auxiliary units on record
    knu_class: ANALYSIS_PACKAGE
    description: What airports supply at the stand, how gas turbines of this class are started, and what auxiliary units of each technology weigh and burn
    research_brief:
      questions:
      - 'What electrical power and what conditioned air do airports supply at the stand to aircraft of 70 to 150 seats — voltage, frequency, rating of fixed and mobile units, flow and temperature of preconditioned air — and how widely is each available? Name the standards and the surveys.'
      - 'What power does the one transport in service with electric packs draw at the stand, through which receptacles and from which sources, and what do its airport-planning documents ask of the ground?'
      - 'How are gas turbines of 1 to 5 MW started electrically, and what power and energy does a start take? Which transport aircraft start their engines from a battery alone?'
      - 'What do auxiliary power units of the class weigh installed, what fuel do they burn in an hour at the stand, and what do airports restrict in their use? Which alternatives were built or flown — a battery module, a fuel cell — with what mass and for how long?'
      - 'Which published hybrid-electric or turboelectric concepts of 50 to 150 seats carry an auxiliary unit, and which of them give the reason?'
    serves: []
    outputs:
    - view: EBS
      ref: null
    exit: 'Figures and precedents, each with its source and with whether it is measured, published or estimated'
