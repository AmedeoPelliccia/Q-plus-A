  raised_at: null
  question: 'Propulsion chain: all-electric, or hybrid-electric with a thermal machine on conventional fuel; distributed or not?'
  context: >-
    The propulsion chain is decided together with the electrical sources. It is either all-electric or hybrid-electric with a thermal machine on conventional fuel, and the propulsors may be distributed along the airframe or concentrated in a few units. The decision drives the wing and airframe integration, the heat to be rejected, and the failure cases the aircraft must survive.
  obligation_source: 02_LIFECYCLE_MODEL §3 — major configuration decisions are LC-B deliverables; eWTW README §5
