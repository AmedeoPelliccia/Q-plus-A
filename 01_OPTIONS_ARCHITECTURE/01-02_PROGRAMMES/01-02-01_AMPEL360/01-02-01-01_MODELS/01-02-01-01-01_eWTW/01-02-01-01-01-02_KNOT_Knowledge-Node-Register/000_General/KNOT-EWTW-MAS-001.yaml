    title: 'Published mass data, methods and structural technologies'
    knu_class: ANALYSIS_PACKAGE
    description: 'Published mass breakdowns and estimation methods for the class, and what composite structure, topology optimisation and additive manufacturing are shown to gain'
    research_brief:
      questions:
      - 'What is the mass of each group — wing, fuselage, tail, landing gear, nacelles, power plant, systems, furnishings — of named aircraft of 70 to 130 seats, and which share of the structure is fittings, brackets and secondary structure?'
      - 'Which primary structures designed by topology optimisation were built, tested or put in service, and what mass did each save against a design already optimised in sizing? Distinguish what was computed, what was built and what is in service.'
      - 'Which additive parts are certified in the structure of airliners: the part, the material, the process, its class of criticality, its mass against the part it replaces, and the reductions applied for fatigue?'
      - 'What are the build size, the deposition rate and the materials of the additive processes in production today and announced to 2035 — powder bed, wire deposition and others — and which machines are installed?'
      - 'What have additive heat exchangers, housings and windings of electric machines and power electronics gained in mass, or in power for each kilogram, by measurement, at powers of hundreds of kilowatts to megawatts?'
