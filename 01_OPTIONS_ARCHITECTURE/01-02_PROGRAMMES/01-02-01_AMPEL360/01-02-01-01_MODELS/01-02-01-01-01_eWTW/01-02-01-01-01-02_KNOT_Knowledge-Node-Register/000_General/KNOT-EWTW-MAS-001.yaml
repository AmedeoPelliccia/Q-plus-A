# KNOT record — AMPEL360-KNOT-CM-004 Issue 1 (proposed)
knot:
  knot_id: KNOT-EWTW-MAS-001
  title: Empty mass of the configuration
  kind: obligation
  taxonomy: ['008', '053', '057', '058']
  raised_at: null
  question: 'What is the empty mass of the eWTW under each option of its fuselage and of its wing, and which part of it rests on structural technologies that are not yet in service?'
  context: >-
    The north star of the programme is measured in fuel, and fuel follows the mass of the aircraft as it follows its drag. The mission screening keeps the empty mass of its reference type for every option; run on copies, it turns three quarters of a relative change in empty mass into fuel. Two studies read in November 2026 show what a comparison by drag alone would miss: a blended body of 98 seats has a better lift-to-drag ratio than a tube-and-wing and burns more fuel, because it is heavier; and a regional aircraft with a fuselage widened from four to five abreast uses more energy, with the mass of the fuselage named as the first cause. On 2026-11-18 the authority asked what a structure largely optimised in topology would gain, at the sizes and capacities of additive manufacturing. A first estimate gives a few per cent of the empty mass, and the primary structure it needs is not in service. This KNOT holds the empty mass by option and the factor each structural technology is allowed, with its maturity. It is an obligation, not a choice between options.
