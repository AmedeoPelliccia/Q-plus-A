    variants: []
    from_baseline: null
  obligation_source: 'AMPEL360-KNOT-CM-004 rule 19; criteria T2 and M5 of KNOT-EWTW-CRZ-001; question of the authority of 2026-11-18 on topology optimisation and additive manufacturing'
