# KNOT record — AMPEL360-KNOT-CM-004 Issue 1 (proposed)
knot:
  knot_id: KNOT-EWTW-FUL-001
  title: Fuel location and energy-carrier bay
  kind: decision-anchor
  taxonomy: ['028', '053', '057']
  raised_at: null
  question: 'Where is the fuel carried — in the wing, in the fuselage bay, or in both — and what does the energy-carrier bay then hold?'
  context: >-
    Since the rulings of 2026-11-14 conventional fuel carries the mission energy of the eWTW in every option. The energy-carrier bay of the fuselage, PBS 053-900, was defined for batteries, with crash protection, containment and a maintenance compartment for electric energy, and a propulsion battery is carried only if KNOT-EWTW-STO-001 retains one. Conventional types carry fuel in the wing box. The first-order screening asks for about 6.8 t of fuel on the requirement mission. The research has to say what volume the wing of an aircraft of the class offers, what a tank in the fuselage costs in structure, protection and centre of gravity, and which requirements apply to fuel in the fuselage.
