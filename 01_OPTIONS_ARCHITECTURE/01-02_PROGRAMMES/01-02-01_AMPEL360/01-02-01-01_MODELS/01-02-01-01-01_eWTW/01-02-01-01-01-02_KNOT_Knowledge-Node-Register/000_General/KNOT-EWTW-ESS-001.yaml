  raised_at: null
  question: 'Essential power: which sources, what segregation and what duration keep essential functions available?'
  context: >-
    Essential power is what keeps the functions needed for continued safe flight and landing alive after the main electrical sources are lost. On an aircraft whose propulsion is electric, the question covers sources, their segregation from the main network, and the duration they must last.
  obligation_source: 02_LIFECYCLE_MODEL §3 — major configuration decisions are LC-B deliverables; eWTW README §5
