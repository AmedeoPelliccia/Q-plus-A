  knus:
  - knu_id: KNU-EWTW-ESS-001-01
    title: Essential loads and duration
    knu_class: ANALYSIS_PACKAGE
    description: What must remain available after loss of the main sources, for how long, and with what segregation
    research_brief:
      questions:
      - For a transport aircraft of about 100 passengers with electric flight controls, an electric environmental control system and electric or hybrid-electric propulsion, which loads belong to the essential list that CS 25.1351(d) and its AMC describe, and what power does each draw? Where no figure is published, give a method to estimate it and state each assumption.
      - Which loads specific to electric propulsion must stay powered after the loss of the normal sources — battery management, contactors, propulsion control, thermal management?
      - What do aircraft of the regional class publish about their essential loads and their endurance — E-Jet, A220, CRJ, ATR 72, Dash 8? Use type-certificate data sheets, special conditions, accident reports and manufacturer publications. Do not use training summaries.
    serves: []
    outputs:
    - view: ReqBS
      ref: null
    exit: Essential load list with duration and segregation
