  - knu_id: KNU-EWTW-ESS-001-02
    title: Essential source options
    knu_class: ANALYSIS_PACKAGE
    description: 'For each option of KNOT-EWTW-SRC-001: candidate essential sources and their segregation from the main sources; this KNU defines the option set of the KNOT'
    research_brief:
      questions:
      - Which emergency sources do aircraft of the regional class use — a ram-air turbine or an air-driven generator, batteries alone, an auxiliary power unit — with their rating, their endurance and their conditions of use? Give a source that can be checked for every figure.
      - Has a certification authority accepted, refused or conditioned the use of a propulsion battery, or of a generator of the propulsion chain, as the alternate source of 25.1351(d)? Cover EASA SC E-19 and its means of compliance, the special conditions for electric and hybrid aircraft, and the type certificates issued so far.
      - For each candidate — dedicated battery, ram-air turbine, segregated generator channel, auxiliary power module, propulsion battery — what makes it independent of the electrical path of propulsion, and which failure would it share with that path?
      - How are the candidates segregated from the main sources, physically and electrically, and what does each weigh installed? Give a source for every figure.
