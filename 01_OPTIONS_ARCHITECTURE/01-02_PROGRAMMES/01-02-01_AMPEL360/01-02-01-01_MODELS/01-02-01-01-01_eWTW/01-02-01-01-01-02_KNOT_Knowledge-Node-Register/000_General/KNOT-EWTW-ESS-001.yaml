# KNOT record — AMPEL360-KNOT-CM-004 Issue 1 (proposed)
knot:
  knot_id: KNOT-EWTW-ESS-001
  title: Essential power
  kind: decision-anchor
  taxonomy: ['012', '022', '023', '024', '026', '031', '034', '042', '046', '047', '049', '076', '079']
  raised_at: null
  question: 'Essential power: which sources, what segregation and what duration keep essential functions available?'
  context: >-
    Essential power is what keeps the functions needed for continued safe flight and landing alive after the main electrical sources are lost. On an aircraft whose propulsion is electric, the question covers sources, their segregation from the main network, and the duration they must last. On such an aircraft the generators or the batteries of the propulsion chain are also the normal electrical sources, so the loss of normal generation can coincide with the loss of thrust. An essential source that shares the electrical path of propulsion is not independent of the failure it has to survive.
