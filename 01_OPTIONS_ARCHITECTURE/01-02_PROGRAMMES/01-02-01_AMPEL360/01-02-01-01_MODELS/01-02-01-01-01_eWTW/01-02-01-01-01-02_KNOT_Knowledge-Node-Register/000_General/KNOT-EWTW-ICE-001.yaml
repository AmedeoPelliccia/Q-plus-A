    title: Ice-protection technologies and aircraft on record
    knu_class: ANALYSIS_PACKAGE
    description: What each technology draws and weighs, which aircraft fly it and up to what speed, and what the rules ask
    research_brief:
      questions:
      - 'Which transport aircraft in service protect wing or tail without engine bleed air, by which technology, and what electrical power do they publish for it — in kilowatts, and for each square metre or each metre of protected leading edge? Distinguish anti-icing from de-icing.'
      - 'What do electromechanical expulsion systems and combined systems draw and weigh, on which aircraft are they certified, and up to what size and speed?'
      - 'Up to what speed and what leading-edge radius are pneumatic boots certified on turboprops of 50 to 90 seats, what air do they need and from where, and what do they cost in drag and in maintenance?'
      - 'How are propellers, spinners and the air inlets of turboshaft engines protected on turboprops in service, and what power does each take?'
      - 'What do CS 25.1419 and CS 25.1420, with Appendices C and O of CS-25, ask of an aircraft of this class, and which surfaces may be left unprotected by showing? Has a strut-braced wing or a folding wingtip been assessed for ice in a published study?'
    serves: []
