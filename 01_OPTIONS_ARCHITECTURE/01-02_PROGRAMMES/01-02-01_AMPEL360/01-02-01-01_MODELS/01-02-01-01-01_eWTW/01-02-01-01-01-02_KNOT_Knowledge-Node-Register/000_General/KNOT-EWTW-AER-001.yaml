# KNOT record — AMPEL360-KNOT-CM-004 Issue 1 (proposed)
knot:
  knot_id: KNOT-EWTW-AER-001
  title: Drag polar of the configuration
  kind: obligation
  taxonomy: ['006', '053', '055', '057']
  raised_at: null
  question: 'Which wetted area, which parasite drag and which lift-to-drag ratio does the eWTW have at each candidate cruise point?'
  context: >-
    The north star of the programme is measured in fuel, and the minimum objective of the aircraft is a carbon dioxide metric 11 % below the new-type limit of ICAO. Both depend on the drag of the aircraft. The screenings of the eWTW use one lift-to-drag ratio, 15, set so that the cruise costs what a fit gives for the reference type, a regional jet. With it the fuel of the three propeller cruise points is equal, so the north star separates only the jet point; and no point meets the minimum objective: the product of the efficiencies and of the lift-to-drag ratio is 4.02 where 4.92 is needed. A lift-to-drag ratio of about 18.4 would close that gap by itself. The architecture of the eWTW lies between a conventional tube-and-wing and a blended wing body, and its dimensions are not on record. A gain in lift-to-drag ratio from that architecture, or from electric propulsors on the wing, is to appear in a polar built from dimensions on record, with its assumptions. It is not to be assumed. This KNOT is an obligation: it owes the analyses a polar. It chooses no architecture.
