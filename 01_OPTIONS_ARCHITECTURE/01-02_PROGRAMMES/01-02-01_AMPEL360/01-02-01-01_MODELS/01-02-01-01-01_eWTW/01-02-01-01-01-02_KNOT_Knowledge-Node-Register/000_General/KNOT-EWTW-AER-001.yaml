    title: 'Published drag data and forecasts for the class'
    knu_class: ANALYSIS_PACKAGE
    description: 'Published lift-to-drag ratios, drag build-up data and certified metric values near 100 seats, and what the forecasts of ICAO expect'
    research_brief:
      questions:
      - 'Which lift-to-drag ratios in cruise are published for aircraft of 70 to 130 seats, turboprops and jets, with the Mach number, the altitude and the mass they hold at, and from which kind of source — flight manual, manufacturer, wind tunnel or calculation?'
      - 'Which wetted areas, zero-lift drag coefficients, equivalent skin-friction coefficients and span efficiency factors are published for those aircraft, or recommended for the class by design handbooks in public use?'
      - 'Which certified values of the carbon dioxide metric of ICAO Annex 16 Volume III are published for the types of the class, with their take-off mass and their reference geometric factor, in the databases of ICAO and of EASA?'
      - 'What do the independent expert review of ICAO, Doc 10127, and the technology appendix of the LTAG report of ICAO forecast for the lift-to-drag ratio, the engine efficiency and the metric value of regional jets and turboprops in 2027, 2037 and 2050?'
      - 'Which lift-to-drag ratio do published studies give to architectures between a tube-and-wing and a blended wing body — a lifting fuselage, a double bubble, a braced wing — near 100 seats, and which of those values were measured?'
