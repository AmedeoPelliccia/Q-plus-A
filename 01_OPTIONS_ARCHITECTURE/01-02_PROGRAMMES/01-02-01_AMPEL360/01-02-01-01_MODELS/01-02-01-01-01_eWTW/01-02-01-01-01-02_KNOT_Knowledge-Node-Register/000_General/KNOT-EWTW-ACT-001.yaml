  knus:
  - knu_id: KNU-EWTW-ACT-001-01
    title: Actuation technologies in service, function by function
    knu_class: ANALYSIS_PACKAGE
    description: What aircraft in service use for each actuated function, what each technology weighs and draws, and how each treats a jam and the loss of a power source
    research_brief:
      questions:
      - 'For transport aircraft certified since 2005 and for regional aircraft of 70 to 130 seats: what powers each function — primary flight controls, spoilers, high lift, trim, landing-gear extension and retraction, braking, steering, doors — and from how many independent sources?'
      - 'What do electro-hydrostatic and electromechanical actuators of flight-control size weigh and draw against the hydraulic actuators they replace, by measurement or by data of the maker? Count the pumps, lines, fluid and reservoirs removed.'
      - 'How do certified designs treat the jam of an electromechanical actuator on a primary surface, and which primary surfaces fly on electromechanical actuators today?'
      - 'What average and what peak electrical power does the actuation of an aircraft of this class take in each phase, and which published load analyses or studies give it?'
      - 'Which transport aircraft brake or retract their landing gear electrically, and with what experience in service?'
    serves: []
    outputs:
    - view: EBS
      ref: null
    exit: 'A table by function and by aircraft, and figures of mass and power, each with its source and with whether it is measured, published or estimated'
