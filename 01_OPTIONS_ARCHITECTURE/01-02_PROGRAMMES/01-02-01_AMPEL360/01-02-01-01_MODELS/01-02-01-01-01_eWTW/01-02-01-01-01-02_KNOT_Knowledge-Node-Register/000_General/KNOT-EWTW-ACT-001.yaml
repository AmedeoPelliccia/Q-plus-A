# KNOT record — AMPEL360-KNOT-CM-004 Issue 1 (proposed)
knot:
  knot_id: KNOT-EWTW-ACT-001
  title: Actuation and utility power
  kind: decision-anchor
  taxonomy: ['024', '027', '029', '032']
  raised_at: null
  question: 'What powers the flight controls, the landing gear, the brakes and the other actuated functions of the eWTW: central hydraulic systems with electric pumps, local electro-hydraulic units, or electromechanical actuators — function by function?'
  context: >-
    The model lists actuation and utility power as an open decision. It says that the electric environmental control system does not decide the fate of hydraulics, and that the technology is allocated function by function. No record holds the decision. The propulsors of the eWTW are electric and its gas turbines drive generators; whether a turbogenerator also drives a hydraulic pump is part of the choice. The essential-loads analysis finds that the power to move the flight controls decides its total, with over two fifths of the nominal load, and that it is its least certain figure: an assumption that stands for that power whatever the technology. The choice of this KNOT sets that figure, the peaks the network has to give, and what stays powered after the loss of the normal sources. The options are families of technology, and the ruling may take a different one for each function. The research has to say what aircraft in service do function by function, what each technology weighs and draws, and what a jam and the loss of a power source ask of each.
  effectivity:
  - model: eWTW
    variants: []
    from_baseline: null
  obligation_source: '02_LIFECYCLE_MODEL §3 — major configuration decisions are LC-B deliverables; eWTW README §3 row 8; assumption A3 of ELA-EWTW-ESS-001'
