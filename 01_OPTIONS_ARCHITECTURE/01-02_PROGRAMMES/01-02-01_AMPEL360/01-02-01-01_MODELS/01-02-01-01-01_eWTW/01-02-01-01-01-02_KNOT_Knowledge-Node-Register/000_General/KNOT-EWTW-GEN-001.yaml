    knu_class: ANALYSIS_PACKAGE
    description: Ratings of turbogenerators that have run or flown, and the number and place of the units in published concepts of the class
    research_brief:
      questions:
      - 'What ratings do turbogenerators and gas-turbine generators for aircraft have that have run on a bench or flown, and at what mass and volume?'
