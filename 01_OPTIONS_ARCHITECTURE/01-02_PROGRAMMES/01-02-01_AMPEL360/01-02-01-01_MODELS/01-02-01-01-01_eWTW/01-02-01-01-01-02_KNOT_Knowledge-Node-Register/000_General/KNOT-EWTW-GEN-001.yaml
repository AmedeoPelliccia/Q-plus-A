# KNOT record — AMPEL360-KNOT-CM-004 Issue 1 (proposed)
knot:
  knot_id: KNOT-EWTW-GEN-001
  title: Generation architecture
  kind: decision-anchor
  taxonomy: ['061', '068']
  raised_at: null
  question: 'Generation architecture: how many turbogenerators, of what rating, and where are they installed?'
  context: >-
    A turbogenerator is a main source of the eWTW in every option since ruling R1 of KNOT-EWTW-SRC-001, and its installation is authorised for definition. That ruling defers the electrical sources to the role of storage, which decides whether a battery is carried and not how many turbogenerators there are. Their number, their rating and their position are a decision of their own, held here. The first-order screening puts the take-off power near 8.8 MW, and the units on record are of about 1 MW. The rating depends on the cruise point, which sets the power needed in climb and cruise against take-off, and on whether a buffer battery takes the peaks. The number depends on the failure case, and the position on where the propulsors are. The research has to say what ratings exist, how many units published concepts of the class adopt and why, and where they install them.
