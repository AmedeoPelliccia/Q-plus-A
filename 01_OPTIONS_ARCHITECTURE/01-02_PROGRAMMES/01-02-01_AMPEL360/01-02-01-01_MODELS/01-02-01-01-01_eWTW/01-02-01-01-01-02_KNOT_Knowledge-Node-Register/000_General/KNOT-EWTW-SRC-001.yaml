  title: Electrical sources
  kind: decision-anchor
  taxonomy: ['012', '024', '049', '068', '074', '076', '079']
  raised_at: null
  question: 'Electrical sources: turbogenerators (068), batteries (074) — alone or combined? Fuel cells (075) left the option set with hydrogen'
  context: >-
    The electrical sources supply both propulsion and the aircraft systems, including an electric bleedless environmental control system that is one of the largest non-propulsive loads. The candidates are batteries, turbogenerators on conventional fuel, or both. Fuel cells are excluded with hydrogen. Since the rulings of 2026-11-14 batteries alone are excluded, a turbogenerator is a main source in every option, and the choice of a propulsion battery beside it is deferred to KNOT-EWTW-STO-001.
