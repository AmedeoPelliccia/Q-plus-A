  rulings:
  - id: R1
    date: '2026-11-14'
    authority: AM.PEL — architecture authority
    statement: 'Two decisions. One: a turbogenerator is a main source of the eWTW in every option that stands, and the turbogenerator installation that options B and C share is authorised for definition. Two: options B and C differ only by a propulsion battery, which is the choice of KNOT-EWTW-STO-001. This KNOT is deferred to that choice and is ruled by the act that rules it, with KNOT-EWTW-PRP-001. Its KNUs continue: the loads, the size of the sources and the distribution do not wait for it'
    effect: turbogenerator installation authorised; the choice between options B and C deferred to KNOT-EWTW-STO-001
    rationale: 'Options A and D are excluded by rulings R2 and R1 of KNOT-EWTW-NRG-001, and both options that stand hold a turbogenerator. What separates them is the choice that ruling R3 of that KNOT defers to KNOT-EWTW-STO-001, for the same reason. This ruling scores nothing: this KNOT has no criteria yet'
