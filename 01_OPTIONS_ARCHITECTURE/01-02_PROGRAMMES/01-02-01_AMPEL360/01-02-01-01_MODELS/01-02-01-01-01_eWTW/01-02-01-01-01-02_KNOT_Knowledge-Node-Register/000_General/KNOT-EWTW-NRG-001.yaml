  - id: R2
    date: '2026-11-14'
    authority: AM.PEL — architecture authority
    statement: 'Four decisions. One: the mission set is approved with three roles — S, 500 km, sensitivity; M, about 1,100 km, the scoring mission; L, 2,000 km with 100 seats and the declared reserves, the requirement mission, which must close. M is not the design mission. The range the reference type is offered with is a check of the model, and no gate until the model reproduces it within a written tolerance. Two: the final reserve of the eWTW is 30 minutes at holding speed at 1,500 ft, taken as an assumption; the alternate is a separate item; the 45 minutes of the charts of the reference type apply only when the model is compared with that type. Three: level 6 of the Q+ATLANTIDE-TRL scale is required of each critical element at the release of the preliminary-design baseline, not of the concept baseline; an element below it passes only with an approved maturation cycle and its fallback, or with a waiver for that element. Four: the aircraft keeps 100 seats, and option A is not a candidate until its reopen condition is met. With it leave option A of KNOT-EWTW-SRC-001, batteries alone, and option A of KNOT-EWTW-PRP-001, all-electric'
    effect: option A excluded, and with it option A of KNOT-EWTW-SRC-001 and option A of KNOT-EWTW-PRP-001; mission set, reserve policy, seat count and required maturity adopted
    rationale: 'Reducing the seats or the stage to make batteries alone close changes the aircraft; it is not a result of the comparison. On the requirement mission, batteries alone need about 3,500 Wh/kg at pack level at nominal values and about 1,560 at favourable ones (MSN-EWTW-NRG-001 0.3.0). The one pack above 450 Wh/kg on record is a laboratory pack over 25 cycles, and the projections on record are at cell level and reach 764 Wh/kg for 2050. The average stage scores and is not the range requirement. The offered range of the reference type cannot be a gate while the model asks for more fuel there than the aircraft loads. Thirty minutes is the floor of turbine-engined aeroplanes, taken because no acceptable means of compliance gives a quantity for electric engines. Level 6 is not lowered to pass one element, and it holds the preliminary-design baseline, so it freezes nothing at the concept baseline'
    rationale_recorded: '2026-11-14'
    evidence:
