# KNOT record — AMPEL360-KNOT-CM-004 Issue 1 (proposed)
knot:
  knot_id: KNOT-EWTW-NRG-001
  title: Energy carrier
  kind: decision-anchor
  taxonomy: ['021', '024', '026', '028', '047', '053', '064', '068', '074', '078', '079']
  raised_at: null
  question: 'Energy carrier: batteries, conventional fuel for a thermal machine — or both? Cryogenic hydrogen is out of scope'
  context: >-
    The energy carrier is the first configuration decision of the eWTW: it fixes what the energy-carrier bay in the fuselage holds, and it conditions the electrical sources, the propulsion chain, thermal management and fire protection. The choice is between batteries alone, conventional fuel (kerosene or sustainable aviation fuel) feeding a thermal machine that generates electricity, or both. Hydrogen is excluded. The decision needs a feasible design mission for a 100-passenger aircraft, so the research must tie every energy figure to range, payload and reserves.
