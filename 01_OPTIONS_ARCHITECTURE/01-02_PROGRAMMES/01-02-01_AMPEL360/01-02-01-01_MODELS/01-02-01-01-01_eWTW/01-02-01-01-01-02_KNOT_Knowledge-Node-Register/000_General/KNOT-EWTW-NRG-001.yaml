  - id: R3
    date: '2026-11-14'
    authority: AM.PEL — architecture authority
    statement: 'Two decisions. One: conventional fuel for a thermal machine carries the mission energy of the eWTW in every option that stands, and the fuel storage that options B and C share is authorised for definition. Two: options B and C differ only by a propulsion battery. Whether one is carried, and in which role, is the choice of KNOT-EWTW-STO-001: its option C is option B of this KNOT, and its options A and B are option C. This KNOT is deferred to that choice and is ruled by the act that rules it'
    effect: fuel storage authorised; the choice between options B and C deferred to KNOT-EWTW-STO-001
    rationale: 'After R1 and R2 two options stand, and both carry conventional fuel for a thermal machine. Three KNOTs held the choice that remains, this one, the electrical sources and the role of storage, and three rulings on one choice can disagree. The mission screening sizes a battery that flies a share of the trip and not one that shaves the peaks, so the choice cannot be scored here before the role is sized. This ruling scores nothing: the criteria stay proposed and are carried to the decision of KNOT-EWTW-STO-001'
    rationale_recorded: '2026-11-14'
    evidence:
    - view: EBS
      ref: 000_General/evidence/KNOT-EWTW-SRC-001_sources-and-storage_2026-11-14.md
