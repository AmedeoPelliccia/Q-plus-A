  rulings:
  - id: R1
    date: '2026-11-07'
    authority: AM.PEL — architecture authority
    statement: 'Scope narrowed: the eWTW is all-electric, or hybrid-electric with conventional fuel; liquid hydrogen is allocated to the BWB-Q100. The KNOT stays open within that scope'
    effect: option D excluded
    rationale: 'The exclusion is a decision of allocation within the family of models. It is not the result of a comparison of carriers on this airframe: no trade of liquid hydrogen on the eWTW is on record, and none is claimed. The family carries liquid hydrogen in one model, the BWB-Q100. For the same energy liquid hydrogen needs about four times the volume of kerosene, which moves its storage out of the wing, and the place of the tanks then drives the centre of gravity. The eWTW is the model with a wide tube and a wing, for 100 passengers: a tube-and-wing, far from a blended wing body. Its wide tube is meant for more comfort and to lay the ground for an architecture better suited to tanks of liquid hydrogen. This model carries none, and its geometry is not yet on record'
    rationale_recorded: '2026-11-14'
    evidence:
    - view: EBS
      ref: 000_General/evidence/KNOT-EWTW-NRG-001_ruling-R1-completion_2026-11-14.md
    waiver: null
    state: COMPLETE
