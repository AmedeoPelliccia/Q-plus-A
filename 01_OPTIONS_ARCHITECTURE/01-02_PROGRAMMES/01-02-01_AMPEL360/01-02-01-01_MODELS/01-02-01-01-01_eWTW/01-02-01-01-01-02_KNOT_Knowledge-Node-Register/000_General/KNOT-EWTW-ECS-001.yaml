    class: mandatory
    text: Fresh air of at least 0.25 kg per occupant and minute in normal operation. Applies to options A, B and C
    source: EASA CS 25.831(a), read on 2026-11-27 (research record of 2026-11-28, statement 43)
    weight: null
    threshold: null
    state: PROPOSED
  - id: E2
    class: mandatory
    text: 'Fresh air not below 0.18 kg per person and minute for any period over five minutes after a probable failure. The loss of one pack in flight is a design case of LC-A, with two packs that share the normal minimum as the working assumption; temporary reductions only where the environment of the compartment is shown not hazardous to the occupants. Applies to options A, B and C'
    source: 'EASA AMC 25.831(a), paragraph 4, read on 2026-11-27 and on 2026-11-28 (research record of 2026-11-28, statements 37 and 38). The paragraph does not name the loss of one source of fresh air: the design case is a ruling of the author of 2026-11-28, registered with STK_SAF, and the classification of the failure condition stays open until the safety assessment'
    weight: null
    threshold: null
    state: PROPOSED
  - id: E3
    class: mandatory
    text: 'Carbon monoxide below 50 ppm, hazardous above one part in 20,000, and carbon dioxide not above 0.5 % by volume at sea-level equivalent, in normal operation and after probable failures. Applies to options A, B and C'
    source: EASA CS 25.831(b) and (c), read on 2026-11-27 (research record of 2026-11-28, statement 43)
    weight: null
    threshold: null
    state: PROPOSED
  - id: E4
    class: mandatory
    text: 'Smoke in the cockpit evacuated, starting from full pressurisation, as CS 25.831(d) conditions it; the air conditioning restartable to clear smoke after a period off. Applies to options A, B and C'
    source: EASA CS 25.831(d) and AMC 25.831(a), read on 2026-11-27 (research record of 2026-11-28, statement 43)
    weight: null
    threshold: null
    state: PROPOSED
  - id: E5
    class: mandatory
    text: Recirculation that can be stopped while the fresh air required is kept. Applies to options A, B and C
    source: EASA AMC 25.831(c), read on 2026-11-27 (research record of 2026-11-28, statement 43)
    weight: null
    threshold: null
    state: PROPOSED
  - id: E6
    class: mandatory
    text: 'Independent control of temperature and air for the crew compartment, unless the exception of CS 25.831(f) applies with all its conditions, among them a whole volume of 22.65 m³ or less and temperatures within 2.8 °C. Applies to options A, B and C'
    source: EASA CS 25.831(e) and (f), read on 2026-11-27 (research record of 2026-11-28, statement 43)
    weight: null
    threshold: null
    state: PROPOSED
  - id: E7
    class: mandatory
    text: 'Ozone within CS 25.832: at FL 310 the average of 0.1 ppm over three hours above FL 270 applies, and at FL 350 also the limit of 0.25 ppm above FL 320. Applies to options A, B and C'
    source: EASA CS 25.832, read on 2026-11-27 (research record of 2026-11-28, statement 43)
    weight: null
    threshold: null
    state: PROPOSED
  - id: E8
    class: mandatory
    text: The valves, regulator, indications, warnings and placard of CS 25.841(b), as the rule conditions them, and the tests of CS 25.843. Applies to options A, B and C
    source: EASA CS 25.841 and CS 25.843, read on 2026-11-27 (research record of 2026-11-28, statement 41). The two cabin altitudes of CS 25.841(a) are criteria M1 and M2 of KNOT-EWTW-CRZ-001 and are not repeated
    weight: null
    threshold: null
    state: PROPOSED
  - id: E9
    class: mandatory
    text: 'Where the refrigerant is a fluorinated gas of Regulation (EU) 2024/573: leak checks from 12 March 2027 at the thresholds of Article 5(1), with records kept five years, and recovery of the refrigerant by trained persons. Applies to options B and C. A system on R-744 would fall outside these duties, as reported'
