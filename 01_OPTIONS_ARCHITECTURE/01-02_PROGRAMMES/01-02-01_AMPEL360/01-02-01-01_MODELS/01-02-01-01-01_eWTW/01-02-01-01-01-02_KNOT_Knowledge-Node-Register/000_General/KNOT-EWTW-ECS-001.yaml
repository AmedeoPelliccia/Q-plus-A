# KNOT record — AMPEL360-KNOT-CM-004 Issue 1 (proposed)
knot:
  knot_id: KNOT-EWTW-ECS-001
  title: Cooling cycle of the packs
  kind: decision-anchor
  taxonomy: ['021', '024', '078']
  raised_at: null
  question: 'Which cycle cools the cabin air of the eWTW: an air cycle fed by the electric compressors, a vapour cycle, or the two combined?'
  context: >-
    The model declares electric packs with no bleed air, and does not declare their cycle. The taxonomy gives the cooling unit two forms, a vapour cycle or a cold sink shared with a cryogenic system, which the eWTW does not carry; it names no air-cycle machine, so an air cycle fed by electric compressors has no home in it. The tree of publications withdrawn on 2026-11-18 described a vapour cycle with design data that no record supports. Section 021-100 of the taxonomy holds the electric compression of outside air, which every option needs for pressure. The cruise point sets the pressure ratio of that compression and the temperature of the ram air; the stand is the case with no ram air at all. The choice also decides whether the packs can share a loop with the thermal management of the electrical chain. The research has to say what each cycle draws and weighs at this size, which aircraft fly each, how each rejects its heat, and what a refrigerant brings in rules and in maintenance.
  effectivity:
  - model: eWTW
    variants: []
    from_baseline: null
  obligation_source: '02_LIFECYCLE_MODEL §3 — major configuration decisions are LC-B deliverables; eWTW README §3 rows 6 and 9; record TPuBS-EWTW-021_withdrawal_2026-11-18, point 2 for the author'
  lifecycle_phase: LC-A
