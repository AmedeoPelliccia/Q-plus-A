  assumptions:
  - text: 'the model declares a bleedless environmental control system with electric packs and electric compressors, and names no cycle'
    ref:
      view: model
      ref: README §3 row 9
  - text: 'the taxonomy says that the air-cycle pack is superseded by an electrically driven compressor with a vapour cycle or a cryogenic cold sink, and names no air-cycle machine'
    ref:
      view: TPuBS
      ref: TPuBS-EWTW-021_withdrawal_2026-11-18.md
  - text: 'the concept of operations carries no figure of power, and leaves open whether this system also cools a propulsion battery or other energy equipment'
    ref:
      view: EBS
      ref: 000_General/evidence/CONOPS-EWTW-ECS-001/README.md
  - text: 'criterion T5 of KNOT-EWTW-CRZ-001 measures the ideal work to compress outside air to the cabin pressure, which every option of this KNOT pays; the working reference of ruling R2 is 360 kt at 31,000 ft'
    ref:
      view: EBS
      ref: 000_General/evidence/KNOT-EWTW-CRZ-001_ruling-R2_2026-11-24.md
  - text: 'the reference of the environmental control is 104 occupants: 100 passengers, 2 pilots and 2 cabin crew. An assumption of the programme, ruled by the author on 2026-11-28: with 100 passenger seats installed on one deck the numerical criterion of ORO.CC.100(b) gives two cabin crew, and the certified configuration may require more. It is reopened if the configuration or the operating minimum changes. For 104 persons the fresh air is 0.4333 kg/s at the normal minimum and 0.3120 kg/s in the case of criterion E2 (research record of 2026-11-28, statement 38)'
    ref:
      view: EBS
      ref: 000_General/evidence/KNOT-EWTW-ECS-001_cooling-cycle-of-the-packs_2026-11-28.md
  - text: 'the loss of one pack in flight is a design case of LC-A, with criterion E2, ruled by the author on 2026-11-28 and registered with STK_SAF. The study takes 0.18 kg of fresh air per person and minute for periods beyond five minutes; the means of compliance admits temporary reductions where the environment is shown to stay safe (research record of 2026-11-28, statement 37). The formal classification of the failure condition stays open until the safety assessment, power supplies, controls and common causes included. Dispatch with one pack already inoperative needs an assessment of its own'
    ref:
      view: EBS
      ref: 000_General/evidence/KNOT-EWTW-ECS-001_cooling-cycle-of-the-packs_2026-11-28.md
  couplings:
