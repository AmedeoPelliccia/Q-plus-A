  knus:
  - knu_id: KNU-EWTW-ECS-001-01
    title: Cooling cycles on record
    knu_class: ANALYSIS_PACKAGE
    description: What each cycle draws and weighs at this size, which aircraft fly each, how each rejects its heat, and what a refrigerant brings
    research_brief:
      questions:
      - 'Which transport and business aircraft in service cool the cabin with an electrically driven air cycle, with a vapour cycle, or with both? For each: the cooling capacity, the electrical power on a hot day on the ground and in cruise, the mass of the packs, and the source.'
      - 'What coefficient of performance do published studies and tests give for each cycle in the conditions of a 100-seat aircraft — hot day at the stand, climb, cruise at 25,000 to 35,000 ft? Distinguish measured from calculated.'
      - 'Which refrigerants are used and allowed in aircraft vapour cycles, what do the rules of the European Union on fluorinated gases ask after 2030, and what do leaks, flammability and maintenance bring?'
      - 'How is the heat rejected in each cycle — ram-air flow and the drag of its circuit, skin heat exchangers, a liquid loop — and which studies share that loop with the cooling of electric machines and power electronics?'
      - 'How does each cycle behave with one pack lost at altitude, and what does dispatch with a pack inoperative ask of each?'
    serves: []
    outputs:
    - view: EBS
      ref: null
    exit: 'Figures and precedents, each with its source and with whether it is measured, published or estimated'
