      key: environmental-cooling-unit
  criteria: []
  maturity_required: []
  assumptions:
  - text: 'the model declares a bleedless environmental control system with electric packs and electric compressors, and names no cycle'
    ref:
      view: model
      ref: README §3 row 9
  - text: 'the taxonomy says that the air-cycle pack is superseded by an electrically driven compressor with a vapour cycle or a cryogenic cold sink, and names no air-cycle machine'
    ref:
      view: TPuBS
      ref: TPuBS-EWTW-021_withdrawal_2026-11-18.md
  - text: 'the concept of operations carries no figure of power, and leaves open whether this system also cools a propulsion battery or other energy equipment'
    ref:
      view: EBS
      ref: 000_General/evidence/CONOPS-EWTW-ECS-001/README.md
  - text: 'criterion T5 of KNOT-EWTW-CRZ-001 measures the ideal work to compress outside air to the cabin pressure, which every option of this KNOT pays; the working reference of ruling R2 is 360 kt at 31,000 ft'
    ref:
      view: EBS
      ref: 000_General/evidence/KNOT-EWTW-CRZ-001_ruling-R2_2026-11-24.md
  - text: 'the reference of the environmental control is 104 occupants: 100 passengers, 2 pilots and 2 cabin crew. An assumption of the programme, ruled by the author on 2026-11-28: with 100 passenger seats installed on one deck the numerical criterion of ORO.CC.100(b) gives two cabin crew, and the certified configuration may require more. It is reopened if the configuration or the operating minimum changes. For 104 persons the fresh air is 0.4333 kg/s at the normal minimum and 0.3120 kg/s in the case of criterion E2 (research record of 2026-11-28, statement 38)'
    ref:
      view: EBS
      ref: 000_General/evidence/KNOT-EWTW-ECS-001_cooling-cycle-of-the-packs_2026-11-28.md
  - text: 'the loss of one pack in flight is a design case of LC-A, with criterion E2, ruled by the author on 2026-11-28 and registered with STK_SAF. The study takes 0.18 kg of fresh air per person and minute for periods beyond five minutes; the means of compliance admits temporary reductions where the environment is shown to stay safe (research record of 2026-11-28, statement 37). The formal classification of the failure condition stays open until the safety assessment, power supplies, controls and common causes included. Dispatch with one pack already inoperative needs an assessment of its own'
    ref:
      view: EBS
      ref: 000_General/evidence/KNOT-EWTW-ECS-001_cooling-cycle-of-the-packs_2026-11-28.md
  couplings:
  - knot: KNOT-EWTW-STO-001
    note: whether this system also cools a propulsion battery is an open input of the concept of operations, decided with the role of storage
  - knot: KNOT-EWTW-PRP-001
    note: 'the electrical chain rejects heat of its own. A liquid loop shared with the packs is open to all three options, at different costs: an air-cycle pack, too, can cool a secondary liquid loop through an exchanger (research record of 2026-11-28, statement 34). The product breakdown takes that interface only if a later decision selects it'
  - knot: KNOT-EWTW-AUX-001
    note: the stand is the case with no ram air; the power the packs draw there sizes its supply
  - knot: KNOT-EWTW-SRC-001
    note: the load analysis has no figure for the power of the packs by phase; it follows the cycle
  rulings: []
  reopen_if: []
  knus:
  - knu_id: KNU-EWTW-ECS-001-01
    title: Cooling cycles on record
    knu_class: ANALYSIS_PACKAGE
    description: What each cycle draws and weighs at this size, which aircraft fly each, how each rejects its heat, and what a refrigerant brings
    research_brief:
      questions:
      - 'Which transport and business aircraft in service cool the cabin with an electrically driven air cycle, with a vapour cycle, or with both? For each: the cooling capacity, the electrical power on a hot day on the ground and in cruise, the mass of the packs, and the source.'
      - 'What coefficient of performance do published studies and tests give for each cycle in the conditions of a 100-seat aircraft — hot day at the stand, climb, cruise at 25,000 to 35,000 ft? Distinguish measured from calculated.'
      - 'Which refrigerants are used and allowed in aircraft vapour cycles, what do the rules of the European Union on fluorinated gases ask after 2030, and what do leaks, flammability and maintenance bring?'
      - 'How is the heat rejected in each cycle — ram-air flow and the drag of its circuit, skin heat exchangers, a liquid loop — and which studies share that loop with the cooling of electric machines and power electronics?'
      - 'How does each cycle behave with one pack lost at altitude, and what does dispatch with a pack inoperative ask of each?'
    serves: []
    outputs:
    - view: EBS
      ref: null
    exit: 'Figures and precedents, each with its source and with whether it is measured, published or estimated'
