# KNOT record — AMPEL360-KNOT-CM-004 Issue 1 (proposed)
knot:
  knot_id: KNOT-EWTW-CRT-001
  title: Certification basis
  kind: obligation
  taxonomy: []
  raised_at: null
  question: 'Certification basis of the eWTW: which specification, which special conditions, and which requirements have no text yet for this aircraft?'
  context: >-
    The records of the eWTW read CS-25 as the basis, and none declares it. The special condition for electric and hybrid propulsion systems covers the propulsion system and, for CS-25 aircraft, is to be complemented with emissions requirements that are not defined yet. The research found three requirements with no text for this aircraft: the climb with one engine inoperative gives no gradient for more than four engines; the planning rule gives no final reserve for electric engines; and lithium batteries on large aeroplanes are handled by special conditions written for batteries far smaller than a propulsion pack. The research has to give the texts in force with their amendment, the proposed ones with their state, and the positions an authority has published.
  effectivity:
  - model: eWTW
    variants: []
    from_baseline: null
  obligation_source: CS-25, Certification Specifications for Large Aeroplanes, read as the basis by the records of the eWTW; EASA SC E-19; research records of 2026-11-13 and 2026-11-14
