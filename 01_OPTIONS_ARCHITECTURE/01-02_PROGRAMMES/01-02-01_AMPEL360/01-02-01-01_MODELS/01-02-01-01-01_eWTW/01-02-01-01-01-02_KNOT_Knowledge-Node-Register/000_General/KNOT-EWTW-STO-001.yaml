knot:
  knot_id: KNOT-EWTW-STO-001
  title: Role of energy storage
  kind: decision-anchor
  taxonomy: ['021', '024', '026', '047', '068', '074', '078', '079']
  raised_at: null
  question: 'Role of energy storage: propulsive energy, buffering for start, transients and peaks, or essential and emergency supply only?'
  context: >-
    Batteries may play three different roles on the eWTW: storing the propulsive energy, buffering starts, transients and peaks, or supplying only essential and emergency loads. The role decides the size, mass and location of the battery installation and the safety case for the energy-carrier bay in the fuselage.
