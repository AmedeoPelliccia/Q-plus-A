    title: 'Wings of the class, span limits and high aspect ratio'
    knu_class: ANALYSIS_PACKAGE
    description: 'Published planforms near 100 seats, the limits that airports put on the span, and what has been measured for high aspect ratio and for propellers on the wing'
    research_brief:
      questions:
      - 'What are the span, the wing area, the aspect ratio, the wing loading at maximum take-off mass and the fuel volume of the wing for the aircraft of 70 to 130 seats in service, in the documents of their manufacturers?'
      - 'Which limits on the wingspan apply to an aircraft of this class at airports — the aerodrome reference code letters of ICAO Annex 14 and the stands they give — and which aircraft fold their wingtips to stay within one?'
      - 'What have high-aspect-ratio wings, braced wings and folding tips shown in published tests and studies for aircraft of 100 to 200 seats: aspect ratio, lift-to-drag ratio, wing mass and flutter?'
      - 'What have propellers at the wingtips and propellers distributed along the span shown for the induced drag and for the wing area needed at low speed, in flight tests, wind-tunnel tests and calculations? Which results were measured?'
      - 'Which take-off and landing field lengths do operators of the class require, and which wing loading and lift coefficient do they imply?'
