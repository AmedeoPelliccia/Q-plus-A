# KNOT record — AMPEL360-KNOT-CM-004 Issue 1 (proposed)
knot:
  knot_id: KNOT-EWTW-WNG-001
  title: 'Wing planform: span, aspect ratio and area'
  kind: decision-anchor
  taxonomy: ['057']
  raised_at: null
  question: 'Which span, which aspect ratio and which area does the wing have?'
  context: >-
    No record defines the wing of the eWTW. The mission screening keeps the airframe of its reference type, a regional jet, and one lift-to-drag ratio of 15 for every cruise point. The wing sets three things that open decisions wait for. Its span and its area set the induced drag and much of the wetted area, and so the lift-to-drag ratio at each cruise point. Its box sets the fuel it can hold: the fuel of the requirement mission, 6.8 to 7.7 t, is more than the tanks of the turboprops of the class hold and 53 to 60 % of what the wing of the reference jet holds. Its loading follows the cruise point and the take-off and landing fields. Electric propulsors along the span or at the tips may change the wing the aircraft needs; that effect is to be shown, not assumed. The stands the class uses limit the span: code letter C stops short of 36 m, and the three types read have spans of 27 to 29 m.
  effectivity:
  - model: eWTW
    variants: []
    from_baseline: null
  obligation_source: '02_LIFECYCLE_MODEL §3 — major configuration decisions are LC-B deliverables; AMPEL360-KNOT-CM-004 rule 19; criterion M5 of KNOT-EWTW-CRZ-001; research record of the fuel location, 2026-11-15'
