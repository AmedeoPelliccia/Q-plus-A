# KNOT record — AMPEL360-KNOT-CM-004 Issue 1 (proposed)
knot:
  knot_id: KNOT-EWTW-DAT-001
  title: Fuselage datum and master geometry
  kind: decision-anchor
  taxonomy: ['053']
  raised_at: null
  question: 'Datum and master geometry: which reference frame and which envelope do the 3D models of the fuselage stations share, and who owns them?'
  context: >-
    The only 3D model of record, EWTW-533001-000, sets its own frame: millimetres, X aft, Y left, Z up, origin on the centreline at the production join plane between the aft fuselage and the tailcone. Its envelope is declared inside its own model request: a conical frustum 3000 mm in diameter 4500 mm forward of the join plane and 2200 mm in diameter at the join plane, with no upsweep, and a splice ring of 2200 mm outside diameter. The request calls these values concept assumptions, to be superseded by ratified frame data. No frame is recorded for the fuselage or for the aircraft, and no artefact outside that request holds the envelope. A second station model can be assembled to the first only if both take the frame and the envelope from one source. Otherwise the assembly joins two sets of private assumptions, and a change in one is not seen by the other.
