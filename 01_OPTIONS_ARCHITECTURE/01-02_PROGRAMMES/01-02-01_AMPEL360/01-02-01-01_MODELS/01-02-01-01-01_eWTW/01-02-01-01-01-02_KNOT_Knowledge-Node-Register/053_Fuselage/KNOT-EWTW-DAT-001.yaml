  knus:
  - knu_id: KNU-EWTW-DAT-001-01
    title: Datum and master-geometry practice
    knu_class: ANALYSIS_PACKAGE
    description: How structural models of several parts share a frame and an envelope, and what each option costs at concept maturity
    research_brief:
      questions:
      - How do transport-aircraft programmes define the fuselage reference frame — station, buttock-line and waterline datums — and where is its origin usually placed? Cite public sources.
      - What is a master geometry, or skeleton model, in top-down CAD design? What does it hold, and how do part models refer to it?
      - In FreeCAD 1.x and in CadQuery, how can several part models share parameters and a frame — spreadsheets or variable sets, links between documents, a shared Python module? What breaks when a shared value changes?
      - At concept maturity, with the fuselage lines not fixed, what is the smallest shared definition that keeps station models consistent with one another?
