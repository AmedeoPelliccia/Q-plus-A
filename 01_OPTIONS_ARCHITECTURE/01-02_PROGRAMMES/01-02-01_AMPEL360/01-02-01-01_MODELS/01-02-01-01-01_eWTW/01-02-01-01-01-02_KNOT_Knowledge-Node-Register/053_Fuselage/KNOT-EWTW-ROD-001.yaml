  knus:
  - knu_id: KNU-EWTW-ROD-001-01
    title: Function of adjustable rods in a rear fuselage
    knu_class: ANALYSIS_PACKAGE
    description: What adjustable rods do in the rear fuselage of transport aircraft, and which host of the options fits the eWTW
    research_brief:
      questions:
      - In transport aircraft, what are adjustable rods — tie rods or struts with spherical rod ends — used for in the rear fuselage and the tailcone? Name the structure or the installation at each end, and the load each rod carries.
      - Why are such rods adjustable? Separate the adjustment made once at assembly from the rigging repeated in maintenance, and state what is measured when a rod is rigged.
      - Which of the known uses have a left and a right rod, each between an upper and a lower fitting, with access for adjustment from outside the structure?
      - Which public standards or specifications cover rod ends, clevis fittings and tie rods for aircraft structure, and what do they fix — sizes, misalignment angle, locking?
      - For a tailcone attached at a production join with a splice ring and indexing pins, is there a public example of rods across the join, and what do they do?
    serves: []
