# KNOT record — AMPEL360-KNOT-CM-004 Issue 1 (proposed)
knot:
  knot_id: KNOT-EWTW-ROD-001
  title: Rear adjustable rods
  kind: decision-anchor
  taxonomy: ['053']
  raised_at: null
  question: 'Rear adjustable rods: what do they connect, and which loads do they carry?'
  context: >-
    Station eWTW-PBS-053-300-020 plans a set of two adjustable rods, left and right, in the rear fuselage. Each rod has a spherical rod end and a clevis fitting at both ends and runs between an upper and a lower support bracket. Two plugs give access for adjustment. The record says that the rods are structure and that their rigging values are maintenance data. It does not say what the rods connect or which loads they carry: the station declares no interface, and the taxonomy subject 053-300-200 is a scaffold without a description. The neighbouring station eWTW-PBS-053-300-010 holds the join package between the aft fuselage and the tailcone: a four-segment splice ring, indexing pins, systems-run brackets and the outflow-valve surround. It declares interfaces with the rear pressure bulkhead, the tailcone and the environmental control system, and none with the rods. A 3D model of the rod set cannot be placed against that structure until each end of each rod has a host.
