  reopen_if: []
  knus:
  - knu_id: KNU-EWTW-FUS-001-01
    title: 'Sections and cabins: the class, and concepts with a lifting fuselage'
    knu_class: ANALYSIS_PACKAGE
    description: 'Published dimensions of fuselages and cabins near 100 seats, and what is claimed and what is measured for a fuselage that carries lift'
    research_brief:
      questions:
      - 'What are the fuselage width and height, the seats abreast, the seat width and the aisle width, the cabin length and the cabin floor area of the aircraft of 70 to 130 seats in service or certified — regional jets, small single-aisles and turboprops — in the documents of their manufacturers?'
      - 'Which published concepts put a wide or flattened fuselage that carries lift between a tube-and-wing and a blended wing body, at 100 to 200 seats? For each: the cross-section, the share of lift the fuselage carries, the wetted area and the lift-to-drag ratio claimed, and whether it comes from a flight test, a wind-tunnel test or a calculation.'
      - 'What do published studies of blended wing bodies say of sizes near 100 seats: the cabin height and the thickness of the centre body, the wetted area for each passenger, and the size at which an advantage over a tube-and-wing appears?'
      - 'What does a pressurised section that is not circular cost in structural mass, in published studies and in aircraft that have flown?'
      - 'How is the reference geometric factor of ICAO Annex 16 Volume III defined, and which values are published for the types of the first question?'
      - 'Which fuselage sections do published designs of hydrogen aircraft of 70 to 150 seats use, and where do they put the tanks of liquid hydrogen — behind the cabin, above it or beside it? Which section and which tank volume do they state, and what does the tank cost in fuselage length?'
