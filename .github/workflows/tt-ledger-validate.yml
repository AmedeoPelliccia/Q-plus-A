# Teknia Token ledger validation — No-AAA compliant.
name: tt-ledger-validate

on:
  pull_request:
    paths:
      - "**/01-01-02-01-01_Teknia-Token/TT-LEDGER/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01_OPTIONS_ARCHITECTURE/01-01_ORGANIZATIONS/01-01-02_ENTERPRISE-DIVISIONS/01-01-02-01_Q-FINANCE/01-01-02-01-01_Teknia-Token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml pytest
      - name: Validate ledger (strict)
        run: python3 tools/validate_ledger.py --strict
      - name: Check derived balances are current
        run: python3 tools/build_balances.py --check
      - name: Run tool tests
        run: pytest tools/tests
